function activityRows(n){
  const entries = auditLog.slice().reverse().slice(0, n);
  if(!entries.length){
    return `<div class="actempty">Nothing changed yet. Every edit from here on records who made it and when — look for the ${svgIcon('history',12)} marker beside any field that has moved.</div>`;
  }
  return entries.map(e => {
    const rec = getRecord(e.id);
    const a = prettyVal(e.f, e.a), b = prettyVal(e.f, e.b);
    const short = v => String(v ?? '').length <= 26;
    const what = e.f === '*reset*'
      ? 'reset the stop to master'
      : (e.f === 'stage'
          ? `moved it to <b>${escapeHtml(b)}</b>`
          : `changed <b>${escapeHtml(fieldLabel(e.f))}</b>` + (
              short(a) && short(b) && b !== ''
                ? ` ${escapeHtml(a === '' ? '(empty)' : a)} → ${escapeHtml(b)}`
                : ''));
    return `<button class="actrow" onclick="go('#/touchpoint/${encodeURIComponent(e.id)}')">
      <span class="aav" title="${escapeAttr(e.u)}">${escapeHtml(initials(e.u))}</span>
      <span class="awho">${escapeHtml(e.u)}</span>
      <span class="awhat">${what} on <b>${escapeHtml(e.id)} · ${escapeHtml(rec.short || '')}</b></span>
      <span class="awhen">${escapeHtml(ago(e.t))}</span>

  }).join('');
}

/* the scope block: delivery detail when it's in scope, a way in when it isn't */
function scopeBlock(id, rec, stage, fs, myRank){
  if(stage === 'watch'){
    const garageFull = inStage('active').length >= WIP_LIMIT;
    return `<div class="bringin">
      ${svgIcon('target',18)}
      <div class="bitxt"><b>On the back burner.</b> Fix Score <b>${fs.score}</b>${myRank ? ` — ${myRank.joint ? 'joint ' : ''}${myRank.rank} of ${shortlist().length} in the Priority Queue` : ''}.
        ${!fs.effortSet ? 'Set <b>what it takes</b> below and this score will sharpen.' : ''}
        ${garageFull ? `The garage is full at ${WIP_LIMIT} — rolling this in means something else comes out.` : ''}
      </div>
      ${fsChips(fs)}
      <div style="width:100%; font-size:12px; color:var(--grey-600);">Use the gear box at the top right to bring it into the garage or the queue.</div>
    </div>`;
  }
  const tq = parseInt(rec.targetQuality, 10);
  const hasTarget = tq >= 1 && tq <= 5;
  const b = DATA.find(d => d.id === id);
  const basePriority = (6 - b.quality) * b.importance * 4;
  const moved = basePriority - rec.priority;
  return `<div class="scopecard ${stage}">
    <div class="schd">
      <h4>${escapeHtml(STAGES[stage].label)}</h4>
      ${effortChip(rec)}
      ${stage === 'active' ? duePill(rec.dueBy) : ''}
      ${moved !== 0 ? `<span class="badge ${moved>0?'badge-main':'badge-side'}" title="Against the June 2026 baseline">${moved>0?'−':'+'}${Math.abs(moved)} priority points since baseline</span>` : ''}
    </div>
    <div class="scopegrid">
      <div class="sg"><label>Lead${histMark(id,'lead')}</label><input type="text" id="scLead" maxlength="40" placeholder="A person, not a team" value="${escapeAttr(rec.lead || '')}"></div>

/* orbital gauge: a satellite tracks along an arc from 4 to 100 */
function orbitGauge(p, hex){
  const min=4, max=100;
  const t = Math.max(0, Math.min(1, (p-min)/(max-min)));
  const start=180, sweep=180;
  const ang = (start - t*sweep) * Math.PI/180;
  const cx=110, cy=105, r=82;
  const sx = cx + r*Math.cos(ang), sy = cy - r*Math.sin(ang);
  const endAng = (start - sweep)*Math.PI/180;
  const arcEndX = cx + r*Math.cos((start - t*sweep)*Math.PI/180);
  const arcEndY = cy - r*Math.sin((start - t*sweep)*Math.PI/180);
  const largeArc = t*sweep > 180 ? 1 : 0;
  /* band arcs so 80 reads as "deep in the red", not "80 out of 100" */
  const arcSeg = (from, to, colour) => {
    const a0 = (start - Math.max(0,Math.min(1,(from-min)/(max-min)))*sweep) * Math.PI/180;
    const a1 = (start - Math.max(0,Math.min(1,(to-min)/(max-min)))*sweep) * Math.PI/180;
    return `<path d="M ${cx + r*Math.cos(a0)} ${cy - r*Math.sin(a0)} A ${r} ${r} 0 0 1 ${cx + r*Math.cos(a1)} ${cy - r*Math.sin(a1)}" fill="none" stroke="${colour}" stroke-width="10" opacity=".22"/>`;
  };
  const tick = v => {
    const a = (start - (v-min)/(max-min)*sweep) * Math.PI/180;
    return `<line x1="${cx + (r-7)*Math.cos(a)}" y1="${cy - (r-7)*Math.sin(a)}" x2="${cx + (r+7)*Math.cos(a)}" y2="${cy - (r+7)*Math.sin(a)}" stroke="#fff" stroke-width="2"/>`;
  };
  return `<svg width="220" height="128" viewBox="0 0 220 128">
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="#E1E4EA" stroke-width="10" stroke-linecap="round"/>
    ${arcSeg(min,45,'#2F8F5B')}${arcSeg(45,70,'#D6941B')}${arcSeg(70,max,'#C4453D')}${tick(45)}${tick(70)}
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 ${largeArc} 1 ${arcEndX} ${arcEndY}" fill="none" stroke="${hex}" stroke-width="10" stroke-linecap="round"/>
    <circle cx="${sx}" cy="${sy}" r="7" fill="${hex}" stroke="#fff" stroke-width="2.5"/>
    <rect x="${sx-13}" y="${sy-1.4}" width="8" height="2.8" rx="1" fill="${hex}" transform="rotate(${-((start - t*sweep))+90} ${sx} ${sy})"/>
    <rect x="${sx+5}" y="${sy-1.4}" width="8" height="2.8" rx="1" fill="${hex}" transform="rotate(${-((start - t*sweep))+90} ${sx} ${sy})"/>
    <text x="${cx}" y="${cy-14}" text-anchor="middle" font-size="34" font-weight="800" fill="${hex}" font-family="Aptos,Segoe UI,sans-serif">${p}</text>
    <text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="10" fill="#9AA3B2" font-family="Aptos,Segoe UI,sans-serif">of 100</text>
    <text x="${cx-r}" y="${cy+16}" text-anchor="middle" font-size="9" fill="#9AA3B2">4</text>
    <text x="${cx+r}" y="${cy+16}" text-anchor="middle" font-size="9" fill="#9AA3B2">100</text>
    <text x="${cx}" y="${cy+17}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${hex}" font-family="Aptos,Segoe UI,sans-serif">${p>=70?'FIX NOW':(p>=45?'WATCH':'HEALTHY')} BAND</text>
  </svg>`;
}

/* inline click-to-edit */
async function commitField(id, field, value){
  if(!requireUser()){ renderStop(id); return; }
  const base = DATA.find(d => d.id === id);
  let v = (typeof value === 'string') ? value.trim() : value;
  if(field === 'short' && !v) v = base.short; /* never allow an empty title */
  return commitFields(id, {[field]: v});
}
/* re-draw whatever the person is actually looking at, not always the stop page */
function rerender(id){

  if(page === 'touchpoint' && arg === id) renderStop(id); else render();
  renderRail();
}
/* commit several fields at once — one save, one audit batch, one re-draw */
/* commit several fields at once, on one or many stops — one save, one audit
   batch, one re-draw. Queued, so rapid clicks cannot overwrite each other. */
async function commitFields(id, vals){ return commitMany([{id, vals}]); }
async function commitMany(edits){
  if(!requireUser()) return;
  return queueMutation(async () => {
    await loadOverrides();
    const batches = [];
    edits.forEach(({id, vals}) => {
      const base = DATA.find(d => d.id === id);
      if(!base) return;
      const prev = getRecord(id);
      const ov = overrides[id] ? {...overrides[id]} : {};
      const changes = [];
      let wrote = false;
      Object.entries(vals).forEach(([k,v]) => {
        const val = (typeof v === 'string') ? v.trim() : v;
        if(String(prev[k] ?? '') === String(val ?? '')) return;
        wrote = true;
        if(!SILENT_FIELDS.has(k)) changes.push({f:k, from:prev[k], to:val});
        if(String(val ?? '') === String(base[k] ?? '')){ delete ov[k]; rememberWrite(id, k, DELETED); }
        else { ov[k] = val; rememberWrite(id, k, val); }
      });
      if(!wrote) return;
      if(Object.keys(ov).length) overrides[id] = ov; else delete overrides[id];
      batches.push({id, changes});
    });
    if(!batches.length){ rerender(edits.length === 1 ? edits[0].id : null); return; }
    await saveOverrides();
    for(const b of batches) if(b.changes.length) await logChanges(b.id, b.changes);
    rerender(edits.length === 1 ? edits[0].id : null);
  });
}
function editInline(el, id, field, kind){
  if(el.querySelector && el.querySelector('.inledit')) return; /* already editing */
  const rec = getRecord(id);
  const cur = rec[field] ?? '';
  let input;
  if(kind === 'route' || kind === 'prog' || kind === 'effort'){
    input = document.createElement('select');
    const opts = kind === 'route'
      ? [['Mainstreet','Mainstreet'],['Sidestreet','Sidestreet']]
      : kind === 'effort'
      ? [['','Not set'],['quick','Just do it — days'],['system','Needs a system change — weeks'],['programme','Needs the programme — quarters']]
      : [['—','Not assigned'],['XX','Project XX'],['Ignite','Project Ignite'],['Nucleus','Project Nucleus']];
    opts.forEach(([val,lbl]) => {
      const op = document.createElement('option');
      op.value = val; op.textContent = lbl; if(val === cur) op.selected = true;
      input.appendChild(op);
    });
    input.onchange = () => commitField(id, field, input.value);
    input.onblur = () => renderStop(id);
  } else if(kind === 'multi'){
    input = document.createElement('textarea');
    input.value = cur;
  } else {
    input = document.createElement('input');
    input.type = 'text'; input.value = cur;
    if(field === 'short') input.maxLength = 26;
  }
  if(kind !== 'route' && kind !== 'prog' && kind !== 'effort'){
    input.onblur = () => commitField(id, field, input.value);
    input.onkeydown = e => {
      if(e.key === 'Enter' && kind !== 'multi'){ e.preventDefault(); input.blur(); }
      if(e.key === 'Escape'){ input.onblur = null; renderStop(id); }
    };
  }
  input.className = 'inledit';
  el.innerHTML = ''; el.appendChild(input);
  input.focus();
  if(input.select){ try{ input.select(); }catch(e){} }
}

function editGhost(id, field, cls, icon, label){

  wrap.className = 'callout ' + cls;
  wrap.innerHTML = `${svgIcon(icon,15)}<div style="flex:1"><b>${label}</b><span class="ghost-target" style="display:block"></span></div>`;
  btn.replaceWith(wrap);

}

async function saveStop(id){

    quality: editQ, importance: editI,

/* ---------- critical few ---------- */
function flowStats(){
  const acc = {};
  DATA.forEach(d => {
    const rec = getRecord(d.id);
    [...new Set((d.tmref||'').match(/[A-Z]2[A-Z]/g) || [])].forEach(f => {
      acc[f] = acc[f] || {sum:0, n:0};
      acc[f].sum += rec.priority; acc[f].n++;
    });
  });
  return Object.entries(acc).map(([f,v]) => ({f, n:v.n, avg:Math.round(v.sum/v.n)}))
    .sort((a,b)=>b.avg-a.avg);
}

function renderHeatmap(){
  setCrumbs(`<a onclick="go('#/home')">Main Street</a> &rsaquo; Heatmap`); setBadge('');
  const recs = DATA.map(d => getRecord(d.id));
  const reds = recs.filter(r => light(r.priority).key==='red');
  const themed = new Set(THEMES.flatMap(t => t.members));
  const redsCovered = reds.filter(r => themed.has(r.id)).length;
  const parked = recs.filter(r => !themed.has(r.id));
  const protectCount = recs.filter(r => r.importance>=4 && r.quality>=4).length;
  const motCount = recs.filter(r => r.importance===5).length;

  /* verdict */
  const verdict = `<div class="verdict">
    <div class="vlbl">The Pareto read</div>
    <h2>Three moves clear every red light on the street.</h2>
    <p>All ${reds.length} red stops are quality-2 performances at make-or-break moments — and ${reds.length-2} of them sit inside one process: Lead-to-Order. Rebuild that pipeline, fix billing data at source, and automate the SLA credit, and the street has no red left. Two smaller moves — a feasibility tool of record and a wholesale rewrite of the front door — round out the plan. Everything else stays parked, on purpose.</p>
    <div class="vstats">
      <div class="vstat"><div class="vn">${THEMES.length}</div><div class="vt">Moves, not ${recs.length} projects</div></div>
      <div class="vstat"><div class="vn">${redsCovered}/${reds.length}</div><div class="vt">Red lights cleared</div></div>
      <div class="vstat"><div class="vn">${themed.size}</div><div class="vt">Stops improved</div></div>
      <div class="vstat"><div class="vn">${parked.length}</div><div class="vt">Stops deliberately parked</div></div>
    </div>
  </div>`;

  /* ---- the map: every stop as a diamond, quality (y) against importance (x) ----
     Stops sharing a score are fanned out inside their cell on a seeded sunflower
     spiral, then relaxed apart to a minimum separation, so nothing hides behind
     anything else. Deterministic: the same scores always draw the same map. */
  const W = 980, H = 560, padL = 78, padR = 26, padT = 22, padB = 62;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const cellW = plotW/5, cellH = plotH/5;
  const xMid = imp => padL + (imp - 0.5) * cellW;
  const yMid = q   => padT + (5 - q + 0.5) * cellH;

  const zones = `
    <rect x="${padL + 3*cellW}" y="${padT}"            width="${2*cellW}" height="${2*cellH}" fill="var(--green-bg)"></rect>
    <rect x="${padL + 3*cellW}" y="${padT + 2*cellH}"  width="${2*cellW}" height="${cellH}"   fill="var(--amber-bg)"></rect>
    <rect x="${padL + 3*cellW}" y="${padT + 3*cellH}"  width="${2*cellW}" height="${2*cellH}" fill="var(--red-bg)" stroke="#EBC3C0" stroke-width="1.5"></rect>
    <text class="zonelbl" x="${padL + 3*cellW + 10}" y="${padT + 18}">Protect</text>
    <text class="zonelbl" x="${padL + 3*cellW + 10}" y="${padT + 2*cellH + 18}">Watch</text>
    <text class="zonelbl" x="${padL + 3*cellW + 10}" y="${padT + 3*cellH + 18}" style="fill:var(--red)">The critical few</text>`;

  let grid = '';
  for(let i=0;i<=5;i++){
    grid += `<line class="gline" x1="${padL + i*cellW}" y1="${padT}" x2="${padL + i*cellW}" y2="${padT+plotH}"></line>`;
    grid += `<line class="gline" x1="${padL}" y1="${padT + i*cellH}" x2="${padL+plotW}" y2="${padT + i*cellH}"></line>`;
  }
  for(let imp=1; imp<=5; imp++){
    grid += `<text class="axtick" x="${xMid(imp)}" y="${padT+plotH+20}" text-anchor="middle">${imp}</text>`;
  }
  for(let q=5; q>=1; q--){
    grid += `<text class="axtick" x="${padL-12}" y="${yMid(q)+4}" text-anchor="end">${q}</text>`;
  }

  const cells = {};
  DATA.forEach(d => {
    const r = getRecord(d.id);
    const k = r.quality + '|' + r.importance;
    (cells[k] = cells[k] || []).push(r);
  });
  const GOLDEN = 2.39996323, rxMax = cellW*0.38, ryMax = cellH*0.38, MIN = 25;
  const pts = [];
  Object.keys(cells).forEach(k => {
    const list = cells[k], n = list.length, rot = (hashStr(k) % 360) * Math.PI/180;
    list.forEach((r, i) => {
      const cx = xMid(r.importance), cy = yMid(r.quality);
      let dx = 0, dy = 0;
      if(n > 1){
        const rad = Math.sqrt((i + 0.6)/n), a = i*GOLDEN + rot;
        const wob = ((hashStr(r.id) % 100)/100 - 0.5) * 0.22;
        dx = rxMax * rad * Math.cos(a) * (1 + wob);
        dy = ryMax * rad * Math.sin(a) * (1 - wob);
      }
      pts.push({r, cx, cy, x: cx + dx, y: cy + dy});
    });
  });
  for(let pass = 0; pass < 90; pass++){
    let moved = false;
    for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
      const a = pts[i], b = pts[j];
      let dx = b.x-a.x, dy = b.y-a.y, dist = Math.hypot(dx,dy);
      if(dist < 0.001){ dx = 0.7; dy = 0.7; dist = 1; }
      if(dist < MIN){
        const push = (MIN-dist)/2/dist;
        a.x -= dx*push; a.y -= dy*push; b.x += dx*push; b.y += dy*push;
        moved = true;
      }
    }
    pts.forEach(p => {
      p.x = Math.max(p.cx - rxMax, Math.min(p.cx + rxMax, p.x));
      p.y = Math.max(p.cy - ryMax, Math.min(p.cy + ryMax, p.y));
    });
    if(!moved) break;
  }
  const diamonds = pts.map(p => {
    const lt = light(p.r.priority), s = 9;
    const gr = stageOf(p.r);
    const ring = gr === 'active' ? '#2B4FC7' : (gr === 'queued' ? '#66A3DC' : null);
    const h = s + 4.5;
    return `<g class="dgroup" onclick="go('#/touchpoint/${encodeURIComponent(p.r.id)}')">
      ${ring ? `<polygon points="${p.x},${p.y-h} ${p.x+h},${p.y} ${p.x},${p.y+h} ${p.x-h},${p.y}" fill="none" stroke="${ring}" stroke-width="2.4"/>` : ''}
      <polygon class="diamond" points="${p.x},${p.y-s} ${p.x+s},${p.y} ${p.x},${p.y+s} ${p.x-s},${p.y}" fill="${lt.hex}">
        <title>${escapeAttr(p.r.id+' \u00b7 '+p.r.short+' \u2014 '+lt.label+', priority '+p.r.priority+' (quality '+p.r.quality+', importance '+p.r.importance+') \u00b7 '+STAGES[gr].label)}</title>
      </polygon>
      <text class="dlabel" x="${p.x+s+3}" y="${p.y+3.2}">${p.r.id}</text>
    </g>`;
  }).join('');

  const quad = `<h3 class="secttitle">Where every stop stands</h3>
  <p class="secthint">Quality of the experience today against how much the moment matters to the partner. Each diamond is one stop, coloured by its traffic light and nudged apart from its neighbours so none is hidden. The bottom-right block is the critical few: broken where it matters most. Click a diamond to open the stop.</p>
  <div class="quadwrap">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">
      ${zones}${grid}
      <text class="axname" x="${padL + plotW/2}" y="${H-16}" text-anchor="middle">Importance to the partner (1 marginal \u2192 5 make or break)</text>
      <text class="axname" x="20" y="${padT + plotH/2}" text-anchor="middle" transform="rotate(-90 20 ${padT + plotH/2})">Quality today (1 poor \u2192 5 excellent)</text>
      ${diamonds}
    </svg>
    <div class="quadkey">
      <span><b>Bottom-right:</b> the critical few \u2014 fix through the five moves.</span>
      <span><b>Middle-right:</b> watch; most improve as a by-product.</span>
      <span><b>Top-right:</b> protect \u2014 currently <b>${protectCount===0?'empty. Nothing high-stakes performs well yet; that is the whole case for Horizon.':protectCount+' stops.'}</b></span>
      <span><b>Left half:</b> leave well alone this year.</span>
      <span><b>Ringed diamonds:</b> <span style="color:#2B4FC7; font-weight:700;">royal blue = in the garage now</span>, <span style="color:#4E8FCB; font-weight:700;">light blue = next up</span>; unringed sit on the back burner.</span>
    </div>
  </div>`;

  /* theme cards */
  const themeCards = THEMES.map((t, i) => {
    const trecs = t.members.map(id => getRecord(id));
    const tReds = trecs.filter(r => light(r.priority).key==='red').length;
    const mass = trecs.reduce((s,r)=>s+r.priority,0);
    const chips = t.members.map(id => {
      const r = getRecord(id); const lt = light(r.priority);
      return `<button class="relchip" onclick="go('#/touchpoint/${encodeURIComponent(id)}')"><span class="dotlight" style="background:${lt.hex}; width:9px; height:9px;"></span>${id} · ${escapeHtml(r.short)}</button>`;
    }).join('');
    return `<div class="themecard">
      <div class="tnum" style="background:${t.colour}">${i+1}</div>
      <div>
        <h4>${escapeHtml(t.name)}</h4>
        <div class="tdesc">${escapeHtml(t.desc)}</div>
        <div class="relchips">${chips}</div>
        ${t.blueprint ? `<button class="btn" style="margin-top:12px;" onclick="go('#/l2o')">Open the Lead-to-Order blueprint →</button>` : ''}
      </div>
      <div class="tstats">
        <div class="tn">${t.members.length}</div><div class="tt">Stops cleared by one move</div>
        <div class="treds" style="color:${tReds?'var(--red)':'var(--green)'}">${tReds?tReds+' red light'+(tReds>1?'s':''):'No reds — quick win'}</div>
        <div class="tt" style="margin-top:6px;">${mass} priority points · ${escapeHtml(t.prog)}</div>
        <div class="tt" style="margin-top:6px; color:var(--blue-strong);">Keeps: ${escapeHtml(t.promise)}</div>
      </div>
    </div>`;
  }).join('');

  /* TM Forum flow bars */
  const flows = flowStats();
  const maxAvg = Math.max(...flows.map(f=>f.avg));
  const flowRows = flows.map(f => {
    const nm = FLOW_NAMES[f.f] || [f.f,''];
    const lt = light(f.avg);
    return `<div class="flowrow">
      <div class="fl">${escapeHtml(nm[0])} <small>${f.f} · ${escapeHtml(nm[1])} · ${f.n} stop${f.n>1?'s':''}</small></div>
      <div class="flowbar"><i style="width:${f.avg/maxAvg*100}%; background:${lt.hex}"></i></div>
      <div class="fv" style="color:${lt.hex}">${f.avg}</div>
    </div>`;
  }).join('');

  document.getElementById('view').innerHTML = `
    <div class="eyebrow">Customer experience triage · TM Forum lens</div>
    <h1 class="pagetitle">Heatmap</h1>
    <p class="lede">A small company can't fix ${recs.length} stops, and shouldn't try. This page reduces the street to the fewest moves that clear the most pain — and gives you explicit permission to park the rest.</p>
    ${verdict}
    ${quad}
    <h3 class="secttitle">The five moves</h3>
    <p class="secthint">Grouped by shared root cause from the field notes — one fix, many stops. Each move keeps a named partner promise. Rescore any stop and these cards recount themselves.</p>
    <div class="themegrid">${themeCards}</div>
    <div class="parkcard"><b>Parked, on purpose:</b> the remaining ${parked.length} stops stay on the street untouched this year — watched through their traffic lights, not worked. Saying no to these is what keeps the five moves funded and finished.</div>
    <h3 class="secttitle">Process health — the TM Forum view</h3>
    <p class="secthint">Average Priority Index by end-to-end process flow (GB921E). Lead-to-Order runs hottest — the same verdict the moves reach from the partner's side. When two lenses agree, believe them.</p>
    <div class="flowbars">${flowRows}</div>
    <div class="footNote">Moments of truth: ${motCount} stops carry importance 5 — the make-or-break moments a partner remembers. Priority Index = (6 − Quality) × Importance × 4. Themes drawn from field notes in the master journey and the Lead-to-Order review, June 2026.</div>
  `;
}

/* ---------- Lead-to-Order blueprint ---------- */
function renderBlueprint(){
  setCrumbs(`<a onclick="go('#/home')">Main Street</a> &rsaquo; <a onclick="go('#/heatmap')">Heatmap</a> &rsaquo; Lead-to-Order blueprint`);
  setBadge('');
  const beforeAfter = `<div class="healthstrip" style="grid-template-columns:repeat(4,1fr);">
    <div class="hcard hc-red"><div class="hnum">22 → 10</div><div class="hlbl">Steps</div><div class="hsub">Best-case today vs the blueprint</div></div>
    <div class="hcard hc-amber"><div class="hnum">8 → 3</div><div class="hlbl">Teams in the flow</div><div class="hsub">Plus an AI assistant doing the running</div></div>
    <div class="hcard hc-amber"><div class="hnum">2 → 0</div><div class="hlbl">Rework loops</div><div class="hsub">Link-budget loop and negotiation loop, closed by design</div></div>
    <div class="hcard hc-green"><div class="hnum">Weeks → min</div><div class="hlbl">Lead to quote</div><div class="hsub">The headline the partner actually feels</div></div>
  </div>`;

  const kpiTiles = `<div class="kpirow" style="grid-template-columns:repeat(4,1fr);">${
    L2O.kpis.map(([k,v]) => `<div class="kpicard"><div class="num" style="font-size:24px;">${escapeHtml(v)}</div><div class="lbl">${escapeHtml(k)}</div></div>`).join('')
  }</div>`;

  const asisPhases = L2O.asis.phases.map(p => `<div class="themecard" style="grid-template-columns:1fr;">
    <div><h4>${escapeHtml(p.n)} <span style="font-weight:600; color:var(--grey-400); font-size:12px;">· ${p.range}</span></h4>
    <div class="tdesc">${escapeHtml(p.pain)}</div></div></div>`).join('');

    <span class="rank">${i+1}</span>
    <span class="fname" style="min-width:210px;">${escapeHtml(s.n)}</span>
    <span class="fwhy" style="white-space:normal;">${escapeHtml(s.d)}</span>
    ${s.ai ? '<span class="badge badge-prog prog-Nucleus" style="min-width:86px; justify-content:center;">Automated</span>' : '<span class="badge badge-tmf" style="min-width:86px; justify-content:center;">Human</span>'}
  </div>`).join('');

  const roleRows = L2O.roles.map(([r,d]) => `<div class="promise"><h4>${escapeHtml(r)}</h4><p>${escapeHtml(d)}</p></div>`).join('');

  const stopChips = L2O.stops.map(id => {
    const r = getRecord(id); const rl = light(r.priority);
    return `<button class="relchip" onclick="go('#/touchpoint/${encodeURIComponent(id)}')"><span class="dotlight" style="background:${rl.hex}; width:9px; height:9px;"></span>${id} · ${escapeHtml(r.short)}</button>`;
  }).join('');

  document.getElementById('view').innerHTML = `
    <div class="eyebrow">From the team's Lead-to-Order review · existing vs dream procedure</div>
    <h1 class="pagetitle">The Lead-to-Order blueprint</h1>
    <p class="lede">The deepest fix on the street, drawn by the people who run it. Today's best case — no exceptions, no surprises — takes 22 steps. The blueprint takes ten, and a partner drives most of them.</p>
    ${beforeAfter}
    <h3 class="secttitle">Today, honestly told</h3>
    <p class="secthint">${escapeHtml(L2O.asis.takeaways)} Teams in the chain: ${L2O.asis.teams.join(' · ')}.</p>
    <div class="themegrid">${asisPhases}</div>
    <h3 class="secttitle">The dream procedure — ten steps</h3>
    <p class="secthint">An AI assistant — sales-engineered, sales-trained, solution-focused and inventory-aware across internal and third-party capacity — runs the journey; the partner and the CSE make the decisions that matter.</p>
    <div class="fixfirst">${dreamSteps}</div>
    <h3 class="secttitle">Targets the blueprint signs up to</h3>
    ${kpiTiles}
    <h3 class="secttitle">Who does what</h3>
    <div class="promisegrid" style="grid-template-columns:repeat(3,1fr);">${roleRows}</div>

    <p class="secthint">Every stop the blueprint touches. Moves 1 and 4 on the Critical Few page deliver it — Move 4 (the inventory-aware feasibility engine) first, because the AI cannot design from inventory that doesn't have a single source of truth.</p>
    <div class="relchips">${stopChips}</div>
    <div class="footNote">Source: Lead-to-Order review deck (existing procedure, team roles, dream procedure, AI-powered journey), Agility Beyond Space, 2026.</div>

function renderStrategy(){
  setCrumbs(`<a onclick="go('#/home')">Main Street</a> &rsaquo; Strategy`); setBadge('');

  const scored = PROMISES.map(p => ({p, s: promiseScore(p)})).sort((a,b) => a.s.score - b.s.score);

  /* KPI row: the four promises ARE the KPIs, scored live off the street */
  const kpiHtml = scored.map(({p, s}) => {
    const b = promiseBand(s.score);
    return `<div class="kpicard" style="border-top:4px solid ${b.hex}">
      <div class="num" style="color:${b.hex}">${s.score}%</div>
      <div class="lbl">${escapeHtml(p.t)}</div>
      <div class="sub">${b.label} \u00b7 ${s.recs.length} stops carry it \u00b7 ${s.reds ? s.reds + ' red' : 'no reds'}</div>
    </div>`;
  }).join('');

  /* promise cards, linked to the stops that keep or break them */
  const promiseHtml = scored.map(({p, s}) => {
    const b = promiseBand(s.score);
    const moves = THEMES.map((t,i) => ({t,i})).filter(({t}) => t.promise === p.t);
    const chips = p.stops.map(id => {
      const r = getRecord(id); if(!r || !r.id) return '';
      const lt = light(r.priority);
      return `<button class="relchip" onclick="go('#/touchpoint/${encodeURIComponent(id)}')"
        title="${escapeAttr(r.touchpoint + ' \u2014 quality ' + r.quality + '/5, importance ' + r.importance + '/5')}">
        <span class="dotlight" style="background:${lt.hex}; width:9px; height:9px;"></span>${id} \u00b7 ${escapeHtml(r.short)}</button>`;
    }).join('');
    const movesHtml = moves.length
      ? `<div class="pmoves">Kept by <b>${moves.map(({t,i}) => `Move ${i+1} \u2014 ${escapeHtml(t.name)}`).join('</b>, <b>')}</b> \u2014 <span onclick="go('#/heatmap')" style="color:var(--blue-strong); font-weight:700; cursor:pointer;">see the critical few</span></div>`
      : '';
    return `<div class="promise" style="border-left-color:${b.hex}">
      <div class="phead">
        <h4>${escapeHtml(p.t)}</h4>
        <span class="light-pill ${b.cls}"><i></i>${b.label}</span>
      </div>
      <div class="pscore"><span class="pnum" style="color:${b.hex}">${s.score}%</span><span class="punit">Promise Delivery Index</span></div>
      <div class="pbar"><i style="width:${s.score}%; background:${b.hex}"></i></div>
      <p>${escapeHtml(p.d)}</p>
      ${s.weak ? `<div class="callout co-problem" style="margin-top:10px;"><b>Weakest link</b>${s.weak.r.id} \u00b7 ${escapeHtml(s.weak.r.short)} \u2014 quality ${s.weak.r.quality}/5 at importance ${s.weak.r.importance}/5. Fix this one and the promise moves most.</div>` : ''}
      ${movesHtml}
      <div class="relchips">${chips}</div>
    </div>`;
  }).join('');

  /* stops that keep no named promise \u2014 a finding, not an omission */
  const claimed = new Set(PROMISES.flatMap(p => p.stops));
  const unclaimed = DATA.filter(d => !claimed.has(d.id)).map(d => getRecord(d.id));
  const unclaimedChips = unclaimed.map(r => {
    const lt = light(r.priority);
    return `<button class="relchip" onclick="go('#/touchpoint/${encodeURIComponent(r.id)}')"><span class="dotlight" style="background:${lt.hex}; width:9px; height:9px;"></span>${r.id} \u00b7 ${escapeHtml(r.short)}</button>`;
  }).join('');

  const progHtml = Object.keys(PROGRAMME_INFO).map(key => {
    const info = PROGRAMME_INFO[key];
    const tagged = DATA.filter(d => d.programme === key);
    const chips = tagged.map(d => `<button class="idchip" onclick="go('#/touchpoint/${encodeURIComponent(d.id)}')" title="${escapeAttr(d.touchpoint)}">${d.id} ${escapeHtml(getRecord(d.id).short)}</button>`).join('');
    return `<div class="progcard">
      <h4><span class="badge badge-prog prog-${key}" style="margin-right:8px;">${info.name}</span></h4>
      <p>${escapeHtml(info.desc)}</p>
      <div class="idchips">${chips || '<span style="font-size:12px;color:var(--grey-400)">No stops tagged yet.</span>'}</div>
    </div>`;
  }).join('');

  const flagged = DATA.filter(d => d.strategyFlag);
  const worst = scored[0];

  document.getElementById('view').innerHTML = `
    <div class="eyebrow">Project Horizon \u2014 The Little Book of our Big Future, June 2026</div>
    <h1 class="pagetitle">Partner Strategy</h1>
    <p class="lede">How Main Street connects to the 2030 vision: from capacity provider to solutions provider \u2014 not MHz sold, but outcomes delivered. The four partner promises are the KPIs, scored live from the street rather than asserted in a deck.</p>
    <h3 class="secttitle">The four promises, scored</h3>
    <p class="secthint">Promise Delivery Index: importance-weighted quality across the stops that carry each promise, worst first. Rescore any stop and these move. Weakest today: <b style="color:var(--navy-800)">${escapeHtml(worst.p.t)}</b> at ${worst.s.score}%.</p>
    <div class="kpirow">${kpiHtml}</div>
    <div class="promisegrid">${promiseHtml}</div>
    <div class="parkcard" style="border-color:#EBD5A4; background:var(--amber-bg); color:#7A5710;">
      <b>Promises nobody made:</b> ${unclaimed.length} stops carry no named partner promise \u2014 the whole of <b>Leave</b>, plus the quarterly business review. Either the four promises stop short of the full journey, or these moments genuinely don't matter to a partner. In a market this small, a clean exit is what departing partners describe to prospective ones, so the first reading looks more likely than the second.
      <div class="relchips" style="margin-top:10px;">${unclaimedChips}</div>
    </div>
    <h3 class="secttitle">Three delivery programmes</h3>
    <p class="secthint">Tagged against Main Street stops so ownership and timing stay traceable.</p>
    ${progHtml}
    <div class="card" style="margin-top:14px;">
      <h4 style="font-size:14px;">Stops flagged for a rating review</h4>
      <p style="font-size:12.5px; color:var(--grey-600); margin:4px 0 8px;">Scores haven't been changed \u2014 these are candidates the strategy suggests re-rating, left for the team to confirm.</p>
      <div class="idchips">${flagged.map(d => `<button class="idchip" onclick="go('#/touchpoint/${encodeURIComponent(d.id)}')">${d.id} ${escapeHtml(getRecord(d.id).short)}</button>`).join('')}</div>
    </div>
    <div class="footNote">Promise Delivery Index = \u03a3(quality \u00d7 importance) \u00f7 \u03a3(5 \u00d7 importance) across the stops listed on each card. Source: The Little Book of our Big Future, published June 2026, strictly confidential to Agility Beyond Space colleagues.</div>
  `;
}

/* ---------- utils ---------- */
function hashStr(s){ let h = 0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; } return h; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

(async function init(){
  /* --- 1. MSAL: load MSAL lib, authenticate, get account --- */
  try {
    await initMSAL();
  } catch(e) {
    console.warn('MSAL init error', e);
  }

  /* --- 2. Set USER from AAD account if available --- */
  if (msalAccount && !USER) {
    const name = msalAccount.name || msalAccount.username || '';
    if (name) await setUser(name);
  }

  /* --- 3. Show the app shell --- */
  const shell = document.getElementById('shell');
  if (shell) shell.style.display = 'flex';
  const loginScreen = document.getElementById('loginScreen');
  if (loginScreen) loginScreen.remove();

  document.getElementById('view').innerHTML = '<div style="padding:40px; color:#6B7280;">Opening Main Street…</div>';
  await Promise.all([loadOverrides(), loadAudit(), loadUser()]);
  renderWhoami();
  render();
  if(!USER) openIdentity({first:true});   /* first visit: ask who\'s walking */
})();
</script>
