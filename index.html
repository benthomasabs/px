<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Main Street — the master B2B partner journey</title>
<style>
:root{
  --navy-900:#0E1A33; --navy-800:#14213D; --navy-700:#1F3864; --navy-600:#2C4A80;
  --blue:#2B7BC4; --blue-strong:#1F6FBF; --blue-light:#66A3DC; --sky-100:#E7F1FC; --sky-50:#F2F8FE;
  --paper:#F6F7F9; --grey-100:#EEF0F3; --grey-200:#E1E4EA; --grey-400:#9AA3B2; --grey-600:#6B7280;
  --ink:#101828; --white:#FFFFFF;
  --green:#2F8F5B; --green-bg:#E8F4EC; --amber:#D6941B; --amber-bg:#FBF2DD; --red:#C4453D; --red-bg:#F9E8E7;
  --royal:#2B4FC7; --royal-dark:#1E3B9E; --royal-bg:#EAEFFC;
  --gear-queue:#66A3DC; --gear-queue-bg:#E7F1FC; --gear-back:#9AA3B2; --gear-back-bg:#EEF0F3;
  --radius:12px;
  --font:'Aptos','Aptos Display','Segoe UI',ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:var(--font); background:var(--paper); color:var(--ink); font-size:14px; line-height:1.45;}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit; font-size:13px;}
#shell{display:flex; height:100vh; overflow:hidden;}

/* ---------- left rail: the metro line ---------- */
#ribbon{width:300px; min-width:300px; background:var(--navy-900); color:#DCE4F2; display:flex; flex-direction:column; overflow:hidden;}
.brand{padding:20px 18px 14px; text-align:center; border-bottom:1px solid rgba(255,255,255,.10);}
.brand .logo{display:block; width:190px; max-width:100%; height:auto; margin:0 auto 13px;}
.brand .word{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:#8FA5CB;}
.brand .title{font-size:26px; font-weight:800; color:#fff; letter-spacing:-.01em; margin-top:2px;}
.brand .sub{font-size:12px; color:#A9BBD9; margin-top:1px;}
.toplinks{display:flex; gap:6px; padding:10px 14px 12px;}
.toplinks button{flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10); color:#CBD8EE; border-radius:8px; padding:7px 4px; font-size:12px; font-weight:600; transition:background .15s;}
.toplinks button:hover{background:rgba(255,255,255,.13);}
.toplinks button.active{background:var(--blue); border-color:var(--blue); color:#fff;}
.searchwrap{padding:0 14px 10px;}
.searchwrap input{width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); color:#EAF0FA; border-radius:8px; padding:8px 11px; outline:none;}
.searchwrap input::placeholder{color:#7E93B8;}
.raillegend{display:flex; gap:12px; padding:0 18px 10px; font-size:10.5px; color:#93A8CC;}
.raillegend span{display:inline-flex; align-items:center; gap:5px;}
.raillegend i{width:8px; height:8px; border-radius:50%; display:inline-block;}
#stopList{flex:1; overflow-y:auto; padding:4px 0 24px;}
#stopList::-webkit-scrollbar{width:8px;}
#stopList::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14); border-radius:4px;}
.district{padding:14px 18px 4px; display:flex; align-items:center; gap:8px; color:#9FB4D8; font-size:11px; font-weight:700; letter-spacing:.10em; text-transform:uppercase; background:none; border:none; width:100%; text-align:left;}
.district:hover{color:#fff;}
.district:hover span{text-decoration:underline; text-underline-offset:3px;}
.district svg{opacity:.85;}
/* the road itself: solid tarmac with centre markings = Mainstreet */
.stops{position:relative; padding-left:22px;}
.stops::before{content:''; position:absolute; left:14px; top:0; bottom:7px; width:8px; border-radius:4px; background:rgba(255,255,255,.11);}
.stops::after{content:''; position:absolute; left:17.5px; top:6px; bottom:13px; width:1px;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.50) 0 5px, rgba(255,255,255,0) 5px 12px);}
.stop{position:relative; display:flex; align-items:center; gap:10px; padding:7px 14px 7px 8px; width:100%; background:none; border:none; text-align:left; color:#D5DFF0;}
/* junction: solid stub onto the road for Mainstreet, dashed slip road for Sidestreet */
.stop.main::before{content:''; position:absolute; left:-8px; top:50%; margin-top:-1.5px; width:16px; height:3px; border-radius:2px; background:rgba(255,255,255,.20);}
.stop.side{padding-left:34px;}
.stop.side::before{content:''; position:absolute; left:-8px; top:50%; margin-top:-1px; width:42px; border-top:2px dashed rgba(255,255,255,.34);}
.stop.side .sname{font-style:italic; color:#C3D0E6;}
.stop.side .node{border-style:dashed;}
.stop .node{position:relative; z-index:1; width:16px; height:16px; min-width:16px; border-radius:50%; border:2.5px solid; background:var(--navy-900); display:flex; align-items:center; justify-content:center;}
.stop .node i{width:6px; height:6px; border-radius:50%;}
.stop .sid{font-size:10.5px; color:#7E93B8; min-width:24px; font-variant-numeric:tabular-nums;}
.stop .sname{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.roadkey{display:flex; gap:14px; padding:0 18px 12px; font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:#93A8CC;}
.roadkey span{display:inline-flex; align-items:center; gap:6px;}
.roadkey i{width:16px; display:inline-block;}
.roadkey .rk-main{border-top:5px solid rgba(255,255,255,.24);}
.roadkey .rk-side{border-top:2px dashed rgba(255,255,255,.44);}
.stop:hover{background:rgba(255,255,255,.06);}
.stop.active{background:rgba(43,123,196,.28);}
.stop.active .sname{color:#fff;}

/* ---------- main canvas ---------- */
#main{flex:1; overflow-y:auto; position:relative;}
#topbar{position:sticky; top:0; z-index:70; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 28px; height:58px; background:rgba(246,247,249,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--grey-200);}
#topbadge{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.crumbs{font-size:12.5px; color:var(--grey-600);}
.crumbs a{color:var(--blue-strong); text-decoration:none; cursor:pointer;}
.crumbs a:hover{text-decoration:underline;}
#view{padding:26px 30px 60px; max-width:1120px;}

/* generic */
.eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey-600); font-weight:700;}
.card{background:var(--white); border:1px solid var(--grey-200); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);}
h1.pagetitle{font-size:30px; font-weight:800; color:var(--navy-800); letter-spacing:-.01em; margin:4px 0 6px;}
p.lede{color:var(--grey-600); font-size:14.5px; max-width:720px;}

/* traffic light pill */
.light-pill{display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:4px 11px; border-radius:999px;}
.light-pill i{width:9px; height:9px; border-radius:50%;}
.lp-red{background:var(--red-bg); color:var(--red);} .lp-red i{background:var(--red);}
.lp-amber{background:var(--amber-bg); color:#9A6B0E;} .lp-amber i{background:var(--amber);}
.lp-green{background:var(--green-bg); color:var(--green);} .lp-green i{background:var(--green);}

/* badges */
.badge{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; border:1px solid;}
.badge-main{color:var(--navy-700); border-color:#C6D4EA; background:var(--sky-50);}
.badge-side{color:#7A5A9E; border-color:#DCCDEE; background:#F6F0FC;}
.badge-prog{border:none; color:#fff;}
.prog-XX{background:#B14A83;} .prog-Ignite{background:#C46A1F;} .prog-Nucleus{background:#3B7CB8;}
.badge-tmf{color:var(--grey-600); border-color:var(--grey-200); background:var(--grey-100); font-variant-numeric:tabular-nums;}

/* ---------- home: health strip + street ---------- */
.healthstrip{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:20px 0 26px;}
.hcard{background:var(--white); border:1px solid var(--grey-200); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.hcard .hnum{font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1;}
.hcard .hlbl{font-size:12px; font-weight:700; margin-top:5px; text-transform:uppercase; letter-spacing:.07em;}
.hcard .hsub{font-size:11.5px; color:var(--grey-600); margin-top:3px;}
.hcard::after{content:''; position:absolute; top:0; left:0; right:0; height:4px;}
.hc-total::after{background:var(--navy-700);} .hc-total .hnum{color:var(--navy-800);} .hc-total .hlbl{color:var(--navy-700);}
.hc-red::after{background:var(--red);} .hc-red .hnum{color:var(--red);} .hc-red .hlbl{color:var(--red);}
.hc-amber::after{background:var(--amber);} .hc-amber .hnum{color:#9A6B0E;} .hc-amber .hlbl{color:#9A6B0E;}
.hc-green::after{background:var(--green);} .hc-green .hnum{color:var(--green);} .hc-green .hlbl{color:var(--green);}

.streetwrap{position:relative; margin:8px 0 30px;}
.streetline{position:absolute; left:0; right:0; top:52px; height:6px; background:linear-gradient(90deg,var(--navy-700),var(--blue)); border-radius:3px; opacity:.18;}
.street{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; position:relative;}
.jcard{background:var(--white); border:1px solid var(--grey-200); border-radius:var(--radius); padding:16px; text-align:left; box-shadow:var(--shadow); transition:transform .12s, box-shadow .12s; position:relative;}
.jcard:hover{transform:translateY(-2px); box-shadow:0 6px 20px rgba(16,24,40,.10);}
.jcard .chnum{position:absolute; top:11px; right:15px; font-size:28px; font-weight:800; color:var(--navy-800); line-height:1; letter-spacing:-.02em;}
.jcard .cicon{width:40px; height:40px; border-radius:10px; background:var(--sky-100); color:var(--navy-700); display:flex; align-items:center; justify-content:center; margin-bottom:10px;}
.jcard h3{font-size:16.5px; font-weight:800; color:var(--navy-800);}
.jcard .jmeta{font-size:11.5px; color:var(--grey-600); margin:3px 0 10px;}
.jlights{display:flex; gap:4px; height:8px; border-radius:4px; overflow:hidden;}
.jlights i{display:block; height:100%;}
.jcounts{display:flex; gap:12px; margin-top:8px; font-size:11px; color:var(--grey-600);}
.jcounts b{color:var(--ink);}

.fixfirst{margin-top:6px;}
.fixrow{display:flex; align-items:center; gap:12px; background:var(--white); border:1px solid var(--grey-200); border-radius:10px; padding:10px 14px; margin-bottom:8px; width:100%; text-align:left; box-shadow:var(--shadow); transition:transform .1s;}
.fixrow:hover{transform:translateX(3px);}
.fixrow .rank{font-size:15px; font-weight:800; color:var(--grey-400); min-width:22px; font-variant-numeric:tabular-nums;}
.fixrow .fid{font-size:11px; color:var(--grey-600); min-width:26px;}
.fixrow .fname{font-weight:700; color:var(--navy-800); min-width:170px;}
.fixrow .fwhy{flex:1; font-size:12.5px; color:var(--grey-600); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.fixrow .fscore{font-size:16px; font-weight:800; color:var(--red); min-width:34px; text-align:right;}

/* ---------- chapter flow view ---------- */
.flowgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-top:18px;}
.stopcard{background:var(--white); border:1px solid var(--grey-200); border-left:5px solid; border-radius:10px; padding:14px 15px; text-align:left; box-shadow:var(--shadow); transition:transform .12s;}
.stopcard:hover{transform:translateY(-2px);}
.stopcard .schead{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.stopcard .scid{font-size:11px; color:var(--grey-600); font-weight:700;}
.stopcard h4{font-size:16px; font-weight:800; color:var(--blue-strong); margin-bottom:4px;}
.stopcard .sclong{font-size:12px; color:var(--grey-600); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.stopcard .scfoot{display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap;}
.dotlight{width:11px; height:11px; border-radius:50%; display:inline-block;}

/* ---------- detail view ---------- */
.detailhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
.d-title{font-family:'Aptos','Aptos Display','Segoe UI',sans-serif; font-size:24px; font-weight:800; color:var(--blue-strong); letter-spacing:-.01em; line-height:1.2;}
.d-sub{font-family:'Aptos','Aptos Display','Segoe UI',sans-serif; font-size:18px; font-weight:500; color:var(--blue-light); margin-top:4px; max-width:840px; line-height:1.35;}
.detailgrid{display:grid; grid-template-columns:1fr 300px; gap:16px; margin-top:20px;}
.motivecard{background:linear-gradient(135deg,var(--navy-800),var(--navy-700)); color:#fff; border-radius:var(--radius); padding:22px 24px; position:relative; overflow:hidden;}
.motivecard .mq{position:absolute; top:-18px; left:10px; font-size:110px; font-weight:800; color:rgba(255,255,255,.07); line-height:1;}
.motivecard .mlbl{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:#9DB6DE; font-weight:700;}
.motivecard .mtxt{font-size:19px; font-weight:700; line-height:1.4; margin-top:8px; position:relative;}
.gaugecard{background:var(--white); border:1px solid var(--grey-200); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center;}
.gaugecard .glbl{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey-600); font-weight:700; align-self:flex-start;}
.gaugefoot{font-size:11px; color:var(--grey-400); text-align:center; margin-top:2px;}
.scorerow{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px;}
.scorecard{background:var(--white); border:1px solid var(--grey-200); border-radius:var(--radius); padding:15px 18px; box-shadow:var(--shadow);}
.scorecard .slbl{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey-600); font-weight:700;}
.scoredots{display:flex; gap:6px; margin-top:9px;}
.scoredots i{width:22px; height:10px; border-radius:5px; background:var(--grey-100);}
.scorecard .sdesc{font-size:11.5px; color:var(--grey-600); margin-top:8px;}
.factsgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px;}
.fact{background:var(--white); border:1px solid var(--grey-200); border-radius:10px; padding:12px 14px; display:flex; gap:11px; align-items:flex-start; box-shadow:var(--shadow);}
.fact .ficon{width:32px; height:32px; min-width:32px; border-radius:8px; background:var(--sky-100); color:var(--navy-700); display:flex; align-items:center; justify-content:center;}
.fact .flbl{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--grey-600); font-weight:700;}
.fact .fval{font-size:13.5px; font-weight:700; color:var(--navy-800); margin-top:1px;}
.callout{border-radius:10px; padding:14px 16px; margin-top:14px; font-size:13px; display:flex; gap:11px; align-items:flex-start;}
.co-note{background:var(--sky-50); border:1px solid #CBDEF2; color:var(--navy-700);}
.co-flag{background:var(--amber-bg); border:1px solid #EBD5A4; color:#7A5710;}
.callout b{display:block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:3px;}
.relatedwrap{margin-top:18px;}
.relchips{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.relchip{display:inline-flex; align-items:center; gap:7px; background:var(--white); border:1px solid var(--grey-200); border-radius:999px; padding:5px 12px 5px 8px; font-size:12px; font-weight:600; color:var(--navy-700); box-shadow:var(--shadow);}
.relchip:hover{border-color:var(--blue);}
.prevnext{display:flex; justify-content:space-between; gap:12px; margin-top:26px;}
.pnbtn{flex:1; background:var(--white); border:1px solid var(--grey-200); border-radius:10px; padding:12px 16px; text-align:left; box-shadow:var(--shadow);}
.pnbtn:hover{border-color:var(--blue);}
.pnbtn .pnlbl{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--grey-400); font-weight:700;}
.pnbtn .pnname{font-size:14px; font-weight:700; color:var(--blue-strong); margin-top:2px;}
.pnbtn.next{text-align:right;}

/* rescore panel */
.editwrap{margin-top:18px;}
.editbar{display:flex; align-items:center; justify-content:space-between;}
.editpanel{background:var(--white); border:1px dashed var(--grey-400); border-radius:var(--radius); padding:16px 18px; margin-top:14px; display:none;}
.editpanel.open{display:block;}
.formgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px 14px; margin-bottom:14px;}
.formgrid .fg-full{grid-column:1 / -1;}
.editpanel input[type=text], .editpanel select{width:100%; border:1px solid var(--grey-200); border-radius:8px; padding:8px 10px; background:#fff;}
.editpanel input:focus, .editpanel textarea:focus, .editpanel select:focus{outline:2px solid var(--blue); outline-offset:0; border-color:var(--blue);}
.co-problem{background:var(--red-bg); border:1px solid #EBC3C0; color:#8A2F29;}
.co-insight{background:var(--green-bg); border:1px solid #BFDEC9; color:#22603F;}
/* inline click-to-edit */
.inl{cursor:text; border-radius:6px; transition:box-shadow .12s;}
.inl:hover{box-shadow:0 0 0 1.5px var(--grey-400); }
.inl:hover::after{content:' ✎'; font-size:.65em; color:var(--grey-400); font-weight:400;}
.motivecard .inl:hover{box-shadow:0 0 0 1.5px rgba(255,255,255,.45);}
.motivecard .inl:hover::after{color:rgba(255,255,255,.6);}
.inledit{font:inherit; color:var(--ink); width:100%; border:1.5px solid var(--blue); border-radius:6px; padding:4px 8px; background:#fff; outline:none; resize:vertical;}
textarea.inledit{min-height:64px; line-height:1.4;}
select.inledit{width:auto; padding:4px 6px; font-size:13px;}
.scoredots.clickable i{cursor:pointer;}
.scoredots.clickable i:hover{outline:1.5px solid var(--blue);}
.addghost{display:inline-flex; align-items:center; gap:7px; background:none; border:1.5px dashed var(--grey-400); color:var(--grey-600); border-radius:10px; padding:9px 14px; font-size:12.5px; font-weight:600; margin-top:14px; margin-right:8px;}
.addghost:hover{border-color:var(--blue); color:var(--blue-strong);}
.edithint{font-size:11.5px; color:var(--grey-400);}
.editpanel label{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--grey-600); display:block; margin-bottom:5px;}
.stepper{display:flex; align-items:center; gap:8px;}
.stepper button{width:26px; height:26px; border-radius:7px; border:1px solid var(--grey-200); background:var(--grey-100); font-weight:800;}
.stepper .stepval{font-size:16px; font-weight:800; min-width:20px; text-align:center;}
.editpanel textarea{width:100%; border:1px solid var(--grey-200); border-radius:8px; padding:8px 10px; min-height:52px; resize:vertical;}
.btn{background:var(--blue-strong); color:#fff; border:none; border-radius:8px; padding:8px 16px; font-weight:700; font-size:13px;}
.btn.ghost{background:var(--grey-100); color:var(--navy-700); border:1px solid var(--grey-200);}
.savedmsg{font-size:12px; color:var(--green); font-weight:700; margin-left:10px;}

/* ---------- heatmap ---------- */
.heatgrid{display:grid; gap:6px; margin-top:18px;}
.heatchaprow{display:grid; grid-template-columns:150px 1fr; gap:10px; align-items:center;}
.heatchaplbl{font-size:12px; font-weight:700; color:var(--navy-700); text-align:right;}
.heatcells{display:flex; gap:6px; flex-wrap:wrap;}
.heatcell{width:82px; height:58px; border-radius:8px; border:none; color:#fff; font-weight:700; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; transition:transform .1s;}
.heatcell:hover{transform:scale(1.06);}
.heatcell .hcid{font-size:10px; opacity:.85;}
.heatcell .hcp{font-size:17px; font-weight:800;}
.heatlegendrow{display:flex; gap:18px; margin-top:16px; font-size:12px; color:var(--grey-600); align-items:center;}

/* ---------- strategy ---------- */
.kpirow{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:14px 0 20px;}
.kpicard{background:var(--white); border:1px solid var(--grey-200); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
.kpicard .num{font-size:34px; font-weight:800; color:var(--blue-strong);}
.kpicard .lbl{font-size:13px; font-weight:700; color:var(--navy-800); margin-top:2px;}
.kpicard .sub{font-size:12px; color:var(--grey-600); margin-top:3px;}
.promisegrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0 24px;}
.promise{background:var(--white); border:1px solid var(--grey-200); border-left:5px solid var(--blue); border-radius:10px; padding:14px 16px; box-shadow:var(--shadow);}
.promise h4{font-size:14.5px; color:var(--navy-800);}
.promise p{font-size:12.5px; color:var(--grey-600); margin-top:8px;}
.promise .phead{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.promise .pscore{display:flex; align-items:baseline; gap:8px; margin-top:8px;}
.promise .pnum{font-size:30px; font-weight:800; line-height:1; letter-spacing:-.02em;}
.promise .punit{font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--grey-400);}
.promise .pbar{height:6px; border-radius:4px; background:var(--grey-100); overflow:hidden; margin-top:8px;}
.promise .pbar i{display:block; height:100%; border-radius:4px;}
.promise .pmoves{font-size:12px; color:var(--grey-600); margin:10px 0 4px;}
.promise .pmoves b{color:var(--navy-800);}
.promise .relchips{margin-top:10px;}
.progcard{background:var(--white); border:1px solid var(--grey-200); border-radius:10px; padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow);}
.progcard h4{font-size:14px;}
.progcard p{font-size:12.5px; color:var(--grey-600); margin:4px 0 8px;}
.idchips{display:flex; gap:6px; flex-wrap:wrap;}
.idchip{background:var(--sky-100); color:var(--navy-700); border:none; border-radius:6px; padding:3px 9px; font-size:11.5px; font-weight:700;}
.idchip:hover{background:var(--blue); color:#fff;}
h3.secttitle{font-size:16px; color:var(--navy-800); margin:22px 0 4px;}
p.secthint{font-size:12.5px; color:var(--grey-600); margin-bottom:8px;}
.footNote{margin-top:26px; font-size:11px; color:var(--grey-400);}

/* ---------- critical few ---------- */
.verdict{background:linear-gradient(135deg,var(--navy-900),var(--navy-700)); color:#fff; border-radius:var(--radius); padding:24px 26px; margin:18px 0 24px; position:relative; overflow:hidden;}
.verdict::after{content:''; position:absolute; right:-40px; top:-40px; width:190px; height:190px; border:2px dashed rgba(255,255,255,.12); border-radius:50%;}
.verdict .vlbl{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:#9DB6DE; font-weight:700;}
.verdict h2{font-size:24px; font-weight:800; margin:6px 0 8px; letter-spacing:-.01em;}
.verdict p{font-size:14px; color:#C9D7EE; max-width:760px;}
.verdict .vstats{display:flex; gap:26px; margin-top:16px; flex-wrap:wrap;}
.verdict .vstat .vn{font-size:26px; font-weight:800;}
.verdict .vstat .vt{font-size:11px; color:#9DB6DE; text-transform:uppercase; letter-spacing:.08em; font-weight:700;}
.badge-mot{color:#8A6D0B; border-color:#E8D48A; background:#FCF6DF;}
.quadwrap{background:var(--white); border:1px solid var(--grey-200); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-top:14px;}
.gline{stroke:var(--grey-200); stroke-width:1;}
.axtick{font-size:12px; fill:var(--grey-400); font-weight:700;}
.axname{font-size:12px; fill:var(--grey-600); font-weight:700;}
.zonelbl{font-size:10.5px; fill:var(--grey-600); font-weight:800; letter-spacing:.09em; text-transform:uppercase;}
.dgroup{cursor:pointer;}
.diamond{stroke:#fff; stroke-width:1.4;}
.dgroup:hover .diamond{stroke:var(--navy-800); stroke-width:2.2;}
.dlabel{font-size:8.5px; font-weight:800; fill:var(--grey-600); opacity:.55; pointer-events:none;}
.dgroup:hover .dlabel{opacity:1; fill:var(--navy-800);}
.quadgrid{display:grid; grid-template-columns:60px repeat(5,1fr); gap:5px;}
.quadcell{min-height:52px; border-radius:8px; padding:6px; display:flex; flex-wrap:wrap; gap:4px; align-content:flex-start; background:var(--grey-100);}
.quadcell.z-crit{background:var(--red-bg); outline:1.5px solid #EBC3C0;}
.quadcell.z-watch{background:var(--amber-bg);}
.quadcell.z-protect{background:var(--green-bg);}
.qaxis{display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--grey-600); text-transform:uppercase; letter-spacing:.06em;}
.qchip{border:none; border-radius:5px; color:#fff; font-size:10px; font-weight:800; padding:3px 6px; line-height:1;}
.qchip:hover{transform:scale(1.12);}
.quadkey{display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; font-size:11.5px; color:var(--grey-600);}
.quadkey b{color:var(--ink);}
.themegrid{display:grid; grid-template-columns:1fr; gap:12px; margin-top:14px;}
.themecard{background:var(--white); border:1px solid var(--grey-200); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); display:grid; grid-template-columns:44px 1fr 190px; gap:16px; align-items:start;}
.themecard .tnum{width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; color:#fff;}
.themecard h4{font-size:16px; font-weight:800; color:var(--navy-800);}
.themecard .tdesc{font-size:12.5px; color:var(--grey-600); margin:3px 0 9px;}
.themecard .tstats{text-align:right;}
.themecard .tstats .tn{font-size:22px; font-weight:800; color:var(--navy-800);}
.themecard .tstats .tt{font-size:10.5px; color:var(--grey-600); text-transform:uppercase; letter-spacing:.06em; font-weight:700;}
.themecard .tstats .treds{font-size:12px; font-weight:700; margin-top:6px;}
.flowbars{margin-top:14px;}
.flowrow{display:grid; grid-template-columns:190px 1fr 44px; gap:12px; align-items:center; margin-bottom:9px;}
.flowrow .fl{font-size:12.5px; font-weight:700; color:var(--navy-800); text-align:right;}
.flowrow .fl small{display:block; font-weight:500; color:var(--grey-400); font-size:10.5px;}
.flowbar{height:16px; border-radius:8px; background:var(--grey-100); overflow:hidden;}
.flowbar i{display:block; height:100%; border-radius:8px;}
.flowrow .fv{font-size:13px; font-weight:800; text-align:right;}
.parkcard{background:var(--grey-100); border:1px dashed var(--grey-400); border-radius:var(--radius); padding:14px 18px; margin-top:14px; font-size:13px; color:var(--grey-600);}
.parkcard b{color:var(--navy-800);}

/* ---------- the board: what's actually in scope ---------- */
.lane{margin-bottom:20px;}
.lanehead{display:flex; align-items:baseline; gap:10px; margin-bottom:9px;}
.lanehead h3{font-size:15px; font-weight:800; color:var(--navy-900); letter-spacing:-.005em;}
.lanehead .cap{font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--grey-400); background:var(--grey-100); border-radius:999px; padding:2px 9px;}
.lanehead .cap.full{background:var(--sky-100); color:var(--blue-strong);}
.lanehead .cap.over{background:var(--red-bg); color:var(--red);}
.lanehead .lhint{font-size:12px; color:var(--grey-600); margin-left:auto;}
.slots{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.slot{background:#fff; border:1px solid var(--grey-200); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 15px; border-top:3px solid var(--grey-200); display:flex; flex-direction:column; gap:9px; text-align:left;}
.slot.queued{background:#FCFDFE;}
.slot .sltop{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
.slot .slid{font-size:10.5px; font-weight:800; letter-spacing:.09em; color:var(--grey-400);}
.slot h4{font-size:16px; font-weight:800; color:var(--navy-800); letter-spacing:-.01em; line-height:1.2;}
.slot .slwin{font-size:12.5px; color:var(--ink); line-height:1.4; border-left:2px solid var(--blue-light); padding-left:9px;}
.slot .slwin.missing{color:var(--grey-400); border-left-color:var(--grey-200); font-style:italic;}
.slot .slmeta{display:flex; flex-wrap:wrap; gap:6px 12px; font-size:11.5px; color:var(--grey-600); margin-top:auto;}
.slot .slmeta b{color:var(--navy-800);}
.slot .slbtns{display:flex; gap:6px; flex-wrap:wrap; padding-top:3px;}
.mini{font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:7px; border:1px solid var(--grey-200); background:#fff; color:var(--navy-700); white-space:nowrap;}
.mini:hover{border-color:var(--blue); color:var(--blue-strong); background:var(--sky-50);}
.mini.go{background:var(--blue); border-color:var(--blue); color:#fff;}
.mini.go:hover{background:var(--blue-strong); color:#fff;}
.slot.empty{border-style:dashed; border-color:var(--grey-200); border-top-style:dashed; background:none; box-shadow:none; align-items:center; justify-content:center; text-align:center; min-height:150px; color:var(--grey-400); font-size:12.5px; gap:8px;}
.progline{height:6px; border-radius:3px; background:var(--grey-100); overflow:hidden; display:flex;}
.progline i{display:block; height:100%;}
.duepill{border-radius:999px; padding:2px 8px; font-size:11px; font-weight:700; background:var(--grey-100); color:var(--grey-600);}
.duepill.soon{background:var(--amber-bg); color:#8A5D08;}
.duepill.late{background:var(--red-bg); color:var(--red);}
.duepill.none{background:none; color:var(--grey-400); border:1px dashed var(--grey-200);}

/* effort */
.efchip{border-radius:999px; padding:2px 9px; font-size:11px; font-weight:800; letter-spacing:.02em; white-space:nowrap; border:1px solid transparent;}
.ef-quick{background:var(--green-bg); color:#1F6B42; border-color:#BFE0CC;}
.ef-system{background:var(--amber-bg); color:#8A5D08; border-color:#EEDCAE;}
.ef-programme{background:var(--sky-100); color:var(--navy-700); border-color:#C6DEF6;}
.ef-unset{background:var(--grey-100); color:var(--grey-600); border-color:var(--grey-200); font-weight:700;}

/* shortlist */
.shortwrap{background:#fff; border:1px solid var(--grey-200); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
.shortrow{display:grid; grid-template-columns:52px 20px 128px 1fr 200px; gap:12px; align-items:center; padding:11px 14px; border-top:1px solid var(--grey-100);}
.shortrow:first-child{border-top:none;}
.shortrow:hover{background:var(--sky-50);}
.rankchip{font-size:13px; font-weight:800; color:var(--navy-800); background:var(--grey-100); border-radius:7px; padding:5px 0; text-align:center;}
.rankchip.joint{background:var(--amber-bg); color:#8A5D08;}
.shortrow .sname2{font-weight:700; color:var(--navy-800); font-size:13.5px; cursor:pointer;}
.shortrow .sname2:hover{color:var(--blue-strong); text-decoration:underline; text-underline-offset:2px;}
.shortrow .swhy{font-size:11.5px; color:var(--grey-600); margin-top:2px;}
.fsbreak{display:flex; gap:5px; flex-wrap:wrap; margin-top:5px;}
.fschip{font-size:10.5px; font-weight:700; color:var(--grey-600); background:var(--grey-100); border-radius:5px; padding:2px 7px;}
.fschip.up{background:var(--sky-100); color:var(--blue-strong);}
.fschip.down{background:var(--grey-100); color:var(--grey-400);}
.fscore{font-size:19px; font-weight:800; text-align:right; line-height:1;}
.fscore small{display:block; font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--grey-400); margin-top:2px;}
.jointnote{background:var(--amber-bg); border:1px solid #EEDCAE; border-radius:9px; padding:9px 13px; font-size:12.5px; color:#7A5207; margin-bottom:12px;}

/* scope panel on the stop page */
.scopecard{background:#fff; border:1px solid var(--grey-200); border-left:4px solid var(--blue); border-radius:var(--radius); box-shadow:var(--shadow); padding:15px 17px; margin:14px 0;}
.scopecard.queued{border-left-color:var(--blue-light);}
.scopecard.done{border-left-color:var(--green);}
.scopecard .schd{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:11px;}
.scopecard .schd h4{font-size:13px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:var(--navy-800);}
.scopegrid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.scopegrid .sg{background:var(--paper); border:1px solid var(--grey-100); border-radius:9px; padding:9px 11px;}
.scopegrid .sg label{display:block; font-size:10px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:var(--grey-600); margin-bottom:4px;}
.scopegrid .sg input, .scopegrid .sg select{width:100%; border:1px solid var(--grey-200); border-radius:7px; padding:6px 8px; font-size:13px; background:#fff; outline:none;}
.scopegrid .sg input:focus, .scopegrid .sg select:focus{border-color:var(--blue);}
.scopewin{margin-top:12px;}
.scopewin label{display:block; font-size:10px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:var(--grey-600); margin-bottom:5px;}
.scopewin textarea{width:100%; min-height:58px; border:1px solid var(--grey-200); border-radius:9px; padding:9px 11px; font-size:13px; resize:vertical; outline:none;}
.scopewin textarea:focus{border-color:var(--blue);}
.scopefoot{display:flex; align-items:center; gap:9px; margin-top:12px; flex-wrap:wrap;}
.bringin{background:var(--sky-50); border:1px dashed #C6DEF6; border-radius:var(--radius); padding:13px 16px; margin:14px 0; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.bringin .bitxt{flex:1; min-width:220px; font-size:12.5px; color:var(--navy-700);}
.bankstrip{display:flex; align-items:center; gap:14px; background:var(--green-bg); border:1px solid #BFE0CC; border-radius:var(--radius); padding:13px 17px; margin-top:6px;}
.bankstrip .bnum{font-size:26px; font-weight:800; color:#1F6B42; line-height:1;}
.bankstrip .btxt{font-size:12.5px; color:#1F6B42;}
.stagetag{font-size:8.5px; font-weight:800; letter-spacing:.06em; padding:1px 5px; border-radius:4px; margin-left:auto; white-space:nowrap;}
.stagetag.active{background:var(--royal); color:#fff;}
.stagetag.queued{background:var(--gear-queue); color:#0E1A33;}

/* the knock-on pop-up */
.cascrow{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:9px; margin-bottom:8px; border:1px solid var(--grey-200);}
.cascrow.in{background:var(--royal-bg); border-color:#B9C6EE;}
.cascrow.bumped{background:var(--gear-queue-bg); border-color:#B7D5F0;}
.cascrow.dropped{background:var(--gear-back-bg);}
.cascarrow{font-size:9.5px; font-weight:800; letter-spacing:.1em; color:var(--grey-400); width:38px; text-align:center;}
.cascrow.in .cascarrow{color:var(--royal-dark);}
.cascname{font-size:13.5px; font-weight:700; color:var(--navy-800);}
.cascnote{font-size:11.5px; color:var(--grey-600); margin-top:1px;}
.cascsum{font-size:12.5px; color:var(--grey-600); line-height:1.5; margin-top:12px; padding-top:11px; border-top:1px solid var(--grey-100);}

/* the gear box, top right of a touchpoint */
.gearbox{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--grey-200); border-radius:10px; padding:6px 10px; box-shadow:var(--shadow);}
.gearbox .gblbl{font-size:9px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; color:var(--grey-400); line-height:1.15; text-align:right;}
.gearbox .gearswitch{border:none;}
.gearbox .gearswitch button{padding:5px 10px; font-size:10.5px;}
.slot .bay{font-size:9px; font-weight:800; letter-spacing:.1em; color:#fff; background:var(--royal); border-radius:4px; padding:2px 6px;}
.slot.queued .bay{background:var(--gear-queue); color:#0E1A33;}

/* ---------- the three gears ---------- */
.gearpill{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:3px 11px; font-size:11px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; border:1px solid transparent;}
.gearpill i{width:7px; height:7px; border-radius:50%; background:currentColor; display:inline-block;}
.gear-active{background:var(--royal); border-color:var(--royal); color:#fff;}
.gear-queued{background:var(--gear-queue-bg); border-color:#9EC6EA; color:#1B5A97;}
.gear-watch{background:var(--gear-back-bg); border-color:var(--grey-200); color:var(--grey-600);}

/* the gear switch: three states, click or drag */
.gearswitch{display:inline-flex; gap:0; border:1px solid var(--grey-200); border-radius:999px; overflow:hidden; background:#fff;}
.gearswitch button{border:none; background:none; padding:6px 13px; font-size:11.5px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:var(--grey-600); border-right:1px solid var(--grey-200); display:flex; align-items:center; gap:6px;}
.gearswitch button:last-child{border-right:none;}
.gearswitch button i{width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--grey-200);}
.gearswitch button:hover{background:var(--paper); color:var(--navy-800);}
.gearswitch button.on{color:#fff;}
.gearswitch button.on i{background:rgba(255,255,255,.85);}
.gearswitch button.on.g-active{background:var(--royal);}
.gearswitch button.on.g-queued{background:var(--gear-queue); color:#0E1A33;}
.gearswitch button.on.g-queued i{background:rgba(14,26,51,.6);}
.gearswitch button.on.g-watch{background:var(--gear-back); color:#fff;}

/* lane framing by gear */
.lane.g-active .lanehead h3{color:var(--royal-dark);}
.lane.g-active .cap{background:var(--royal-bg); color:var(--royal-dark);}
.lane.g-queued .cap{background:var(--gear-queue-bg); color:#1B5A97;}
.lane.g-watch .cap{background:var(--gear-back-bg); color:var(--grey-600);}
.slot.active{border-left:4px solid var(--royal);}
.slot.queued{border-left:4px solid var(--gear-queue); background:#FCFDFE;}

/* drag and drop */
.dropzone{border-radius:var(--radius); transition:background .12s, box-shadow .12s; min-height:60px; padding:2px;}
.dropzone.over{background:var(--royal-bg); box-shadow:inset 0 0 0 2px var(--royal);}
.lane.g-queued .dropzone.over{background:var(--gear-queue-bg); box-shadow:inset 0 0 0 2px var(--gear-queue);}
.lane.g-watch .dropzone.over{background:var(--gear-back-bg); box-shadow:inset 0 0 0 2px var(--gear-back);}
.draggable{cursor:grab;}
.draggable:active{cursor:grabbing;}
.dragging{opacity:.4;}
.grip{color:var(--grey-400); cursor:grab; display:inline-flex; align-items:center; justify-content:center; padding:4px 2px; border-radius:5px; flex-shrink:0;}
.grip:hover{color:var(--royal); background:var(--royal-bg);}
.grip:active{cursor:grabbing;}

/* undo toast */
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px); z-index:140;
  display:none; align-items:center; gap:14px; background:var(--navy-900); color:#EAF0FA;
  border-radius:999px; padding:11px 12px 11px 20px; font-size:13px; box-shadow:0 12px 34px rgba(14,26,51,.34);
  max-width:min(680px, calc(100vw - 32px)); opacity:0; transition:opacity .16s, transform .16s;}
#toast.open{display:flex; opacity:1; transform:translateX(-50%) translateY(0);}
#toast b{color:#fff;}
#toast button{background:var(--royal); border:none; color:#fff; font-weight:800; font-size:12px; letter-spacing:.04em;
  text-transform:uppercase; border-radius:999px; padding:7px 15px; white-space:nowrap;}
#toast button:hover{background:#3D62DA;}
#toast button.tx{background:none; color:#8FA5CB; font-size:17px; padding:0 6px; text-transform:none; letter-spacing:0;}
#toast button.tx:hover{color:#fff; background:none;}
.dndhint{font-size:12px; color:var(--grey-600); background:var(--sky-50); border:1px dashed #C6DEF6; border-radius:9px; padding:8px 13px; margin-bottom:16px; display:flex; align-items:center; gap:9px;}

/* the gear dock: always-reachable drop targets, so you never drag across a scroll */
.geardock{position:sticky; top:58px; z-index:60; display:grid; grid-template-columns:auto 1fr 1fr 1fr; gap:10px; align-items:stretch;
  background:rgba(246,247,249,.94); backdrop-filter:blur(6px); border:1px solid var(--grey-200); border-radius:var(--radius);
  padding:10px 12px; margin-bottom:18px; box-shadow:var(--shadow);}
.geardock .dklbl{display:flex; align-items:center; font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--grey-400); max-width:112px; line-height:1.25;}
.dockzone{border:1.5px dashed var(--grey-200); border-radius:9px; padding:8px 11px; display:flex; align-items:center; gap:9px; background:#fff; transition:background .12s, border-color .12s;}
.dockzone .dkn{font-size:19px; font-weight:800; line-height:1;}
.dockzone .dkt{font-size:11.5px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; line-height:1.2;}
.dockzone .dks{font-size:10.5px; color:var(--grey-400); font-weight:600;}
.dockzone.g-active{border-color:#B9C6EE;} .dockzone.g-active .dkn, .dockzone.g-active .dkt{color:var(--royal-dark);}
.dockzone.g-queued{border-color:#B7D5F0;} .dockzone.g-queued .dkn, .dockzone.g-queued .dkt{color:#1B5A97;}
.dockzone.g-watch{border-color:var(--grey-200);} .dockzone.g-watch .dkn, .dockzone.g-watch .dkt{color:var(--grey-600);}
.dockzone.over{border-style:solid;}
.dockzone.g-active.over{background:var(--royal-bg); border-color:var(--royal);}
.dockzone.g-queued.over{background:var(--gear-queue-bg); border-color:var(--gear-queue);}
.dockzone.g-watch.over{background:var(--gear-back-bg); border-color:var(--gear-back);}
body.dragging-now .dockzone{border-style:solid; box-shadow:0 0 0 3px rgba(43,79,199,.08);}
body.dragging-now .geardock{border-color:var(--royal);}

/* back burner list rows */
.bbrow{display:grid; grid-template-columns:22px 46px 20px 122px 1fr auto; gap:11px; align-items:center; padding:9px 13px; border-top:1px solid var(--grey-100); background:#fff;}
.bbrow:first-child{border-top:none;}
.bbrow:hover{background:var(--sky-50);}
.bbrow .bbname{font-weight:700; color:var(--navy-800); font-size:13px; cursor:pointer;}
.bbrow .bbname:hover{color:var(--blue-strong); text-decoration:underline; text-underline-offset:2px;}
.bbrow .bbwhy{font-size:11px; color:var(--grey-600); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bblist{max-height:none;}
.gearlegend{display:flex; gap:8px 22px; flex-wrap:wrap; font-size:12px; color:var(--grey-600); margin:14px 0 18px; line-height:1.5;}
.gearlegend span{display:inline-flex; align-items:center; gap:6px;}
.gearlegend i{width:10px; height:10px; border-radius:3px; display:inline-block;}
.toplinks.quad{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.toplinks.quad button{flex:none; width:100%; padding:8px 4px; font-size:11.5px;}
.l2obtn{background:var(--navy-700); border:1px solid var(--navy-700); color:#fff; border-radius:8px; padding:6px 11px; font-size:11.5px; font-weight:700; display:inline-flex; align-items:center; gap:6px;}
.l2obtn:hover{background:var(--navy-800); border-color:var(--navy-800);}

/* ---------- who's on the street: identity + lite audit trail ---------- */
#whoami{border-top:1px solid rgba(255,255,255,.10); padding:10px 14px 12px; display:flex; align-items:center; gap:9px; background:rgba(0,0,0,.16);}
#whoami .av{width:28px; min-width:28px; height:28px; border-radius:50%; background:var(--blue); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; letter-spacing:.02em;}
#whoami .av.anon{background:rgba(255,255,255,.14); color:#9FB4D8;}
#whoami .wtxt{flex:1; min-width:0;}
#whoami .wname{font-size:12.5px; font-weight:700; color:#EAF0FA; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#whoami .wsub{font-size:10.5px; color:#8FA5CB;}
#whoami .wsub button{background:none; border:none; color:#8FA5CB; font-size:10.5px; padding:0; text-decoration:underline; text-underline-offset:2px;}
#whoami .wsub button:hover{color:#fff;}
#whoami .wact{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); color:#CBD8EE; border-radius:7px; padding:5px 6px; display:flex; align-items:center;}
#whoami .wact:hover{background:rgba(255,255,255,.16); color:#fff;}

/* the reveal marker: a faint clock beside anything that has been changed */
.d-title > .inl, .d-sub > .inl{display:inline-block; max-width:calc(100% - 24px);}
.hbadge{background:none; border:none; padding:0 0 0 5px; color:var(--grey-400); vertical-align:middle; line-height:1; display:inline-flex; align-items:center; border-radius:4px;}
.hbadge:hover{color:var(--blue-strong);}
.hbadge.on{color:var(--blue);}

/* anchored reveal box */
#histpop{position:fixed; z-index:120; width:330px; max-width:calc(100vw - 24px); background:#fff; border:1px solid var(--grey-200); border-radius:10px; box-shadow:0 8px 30px rgba(16,24,40,.18); padding:12px 13px; display:none;}
#histpop.open{display:block;}
#histpop .hp-h{font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--grey-400); font-weight:700; margin-bottom:8px;}
#histpop .hp-x{position:absolute; top:7px; right:8px; background:none; border:none; color:var(--grey-400); font-size:15px; line-height:1;}
#histpop .hp-x:hover{color:var(--ink);}
.histrow{padding:8px 0; border-top:1px solid var(--grey-100); font-size:12.5px;}
.histrow:first-of-type{border-top:none;}
.histwho{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
.histwho b{color:var(--navy-800);}
.histwho span{color:var(--grey-400); font-size:11px;}
.histfield{font-size:11px; font-weight:700; color:var(--blue-strong); text-transform:uppercase; letter-spacing:.06em;}
.histdiff{margin-top:4px; font-size:12px; line-height:1.4;}
.histdiff .was{color:var(--grey-600); text-decoration:line-through; text-decoration-color:var(--grey-400);}
.histdiff .now{color:var(--ink); font-weight:600;}
.histdiff .arr{color:var(--grey-400); padding:0 5px;}
.histempty{font-size:12.5px; color:var(--grey-600);}

/* modal shell: identity prompt, stop history, activity feed */
.ovl{position:fixed; inset:0; background:rgba(14,26,51,.55); z-index:130; display:flex; align-items:center; justify-content:center; padding:24px;}
.ovl .mdl{background:#fff; border-radius:14px; box-shadow:0 24px 70px rgba(16,24,40,.30); width:520px; max-width:100%; max-height:86vh; display:flex; flex-direction:column; overflow:hidden;}
.mdl .mhead{padding:20px 22px 14px; border-bottom:1px solid var(--grey-100); position:relative;}
.mdl .mhead .eyebrow{margin-bottom:4px;}
.mdl .mhead h2{font-size:20px; font-weight:800; color:var(--navy-900); letter-spacing:-.01em;}
.mdl .mhead p{font-size:13px; color:var(--grey-600); margin-top:5px;}
.mdl .mbody{padding:18px 22px; overflow-y:auto;}
.mdl .mfoot{padding:14px 22px 18px; display:flex; align-items:center; gap:10px; border-top:1px solid var(--grey-100);}
.mdl .mx{position:absolute; top:14px; right:14px; background:none; border:none; color:var(--grey-400); font-size:19px; line-height:1;}
.mdl .mx:hover{color:var(--ink);}
.idfield{display:block;}
.idfield label{display:block; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--grey-600); margin-bottom:6px;}
.idfield input{width:100%; border:1px solid var(--grey-200); border-radius:9px; padding:11px 13px; font-size:15px; outline:none;}
.idfield input:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--sky-100);}
.idnote{font-size:12px; color:var(--grey-600); margin-top:10px; line-height:1.45;}

/* street-wide activity */
.actwrap{background:#fff; border:1px solid var(--grey-200); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-top:6px;}
.actrow{display:grid; grid-template-columns:30px 128px 1fr 96px; gap:11px; align-items:center; width:100%; text-align:left; background:none; border:none; border-top:1px solid var(--grey-100); padding:9px 14px; font-size:12.5px;}
.actrow:first-child{border-top:none;}
.actrow:hover{background:var(--sky-50);}
.actrow .aav{width:26px; height:26px; border-radius:50%; background:var(--navy-700); color:#fff; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center;}
.actrow .awho{font-weight:700; color:var(--navy-800); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.actrow .awhat{color:var(--grey-600); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.actrow .awhat b{color:var(--ink); font-weight:700;}
.actrow .awhen{color:var(--grey-400); font-size:11.5px; text-align:right; white-space:nowrap;}
.actempty{padding:16px 14px; font-size:12.5px; color:var(--grey-600);}
.editedby{background:var(--sky-100); border:1px solid #C6DEF6; color:var(--blue-strong); border-radius:999px; padding:3px 10px; font-size:11px; font-weight:700; display:inline-flex; align-items:center; gap:5px;}
.editedby:hover{background:#D9EAFA;}

@media (max-width:1000px){
  .slots{grid-template-columns:1fr;}
  .scopegrid{grid-template-columns:1fr;}
  .shortrow{grid-template-columns:46px 1fr auto; }
  .shortrow .efcell, .shortrow .lightcell{display:none;}
  .actrow{grid-template-columns:26px 1fr 76px; }
  .actrow .awhat{display:none;}
  .themecard{grid-template-columns:44px 1fr;}
  .themecard .tstats{text-align:left;}
  .street{grid-template-columns:repeat(2,1fr);}
  .healthstrip{grid-template-columns:repeat(2,1fr);}
  .kpirow{grid-template-columns:repeat(2,1fr);}
  .promisegrid{grid-template-columns:1fr;}
  .detailgrid{grid-template-columns:1fr;}
  .factsgrid{grid-template-columns:repeat(2,1fr);}
  #ribbon{width:250px; min-width:250px;}
}
</style>

<script>
/* =============================================================
   MSAL.js SSO + SharePoint Graph API backend
   Client ID:  1acef3ee-0e94-4425-a23c-435835512620
   Tenant ID:  d63c6516-eb15-470f-bf21-db8b9af19268
   SharePoint: absatelliteglobal.sharepoint.com/sites/MIS
   Lists: PX_Partners, PX_Activity
   ============================================================= */

const MSAL_CONFIG = {
  auth: {
    clientId: '1acef3ee-0e94-4425-a23c-435835512620',
    authority: 'https://login.microsoftonline.com/d63c6516-eb15-470f-bf21-db8b9af19268',
    redirectUri: window.location.origin
  },
  cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false }
};

const GRAPH_SCOPES = ['User.Read', 'Sites.ReadWrite.All'];
const SP_SITE = 'absatelliteglobal.sharepoint.com:/sites/MIS';
const SP_LIST_OVERRIDES = 'PX_Partners';
const SP_LIST_AUDIT    = 'PX_Activity';

let msalApp = null;
let msalAccount = null;
let spSiteId = null;

/* ---------- auth helpers ---------- */
async function initMSAL() {
  const { PublicClientApplication } = window.msal;
  msalApp = new PublicClientApplication(MSAL_CONFIG);
  await msalApp.initialize();
  const resp = await msalApp.handleRedirectPromise().catch(() => null);
  if (resp) { msalAccount = resp.account; return; }
  const accounts = msalApp.getAllAccounts();
  if (accounts.length) { msalAccount = accounts[0]; return; }
  /* no account — trigger login */
  showLoginScreen();
  await msalApp.loginRedirect({ scopes: GRAPH_SCOPES });
}

function showLoginScreen() {
  document.getElementById('shell').style.display = 'none';
  const d = document.createElement('div');
  d.id = 'loginScreen';
  d.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0E1A33;z-index:9999;';
  d.innerHTML = `<div style="text-align:center;color:#fff;font-family:Aptos,Segoe UI,sans-serif;">
    <img src="https://www.absatellite.com/wp-content/uploads/2023/07/agility-beyond-space-logo.png" style="width:220px;margin-bottom:28px;" onerror="this.style.display='none'">
    <h2 style="font-size:22px;font-weight:800;margin-bottom:8px;">Main Street</h2>
    <p style="color:#8FA5CB;font-size:13px;margin-bottom:28px;">Sign in with your Agility Beyond Space account</p>
    <div style="width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:#2B7BC4;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;"></div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </div>`;
  document.body.appendChild(d);
}

async function getToken() {
  if (!msalApp || !msalAccount) return null;
  try {
    const r = await msalApp.acquireTokenSilent({ scopes: GRAPH_SCOPES, account: msalAccount });
    return r.accessToken;
  } catch(e) {
    const r = await msalApp.acquireTokenPopup({ scopes: GRAPH_SCOPES });
    msalAccount = r.account;
    return r.accessToken;
  }
}

async function graphGet(path) {
  const token = await getToken();
  const r = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  if (!r.ok) throw new Error(`Graph GET ${path} → ${r.status}`);
  return r.json();
}

async function graphPost(path, body) {
  const token = await getToken();
  const r = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(`Graph POST ${path} → ${r.status}`);
  return r.json();
}

async function graphPatch(path, body) {
  const token = await getToken();
  const r = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    method: 'PATCH',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(`Graph PATCH ${path} → ${r.status}`);
  return r.json();
}

async function getSiteId() {
  if (spSiteId) return spSiteId;
  const d = await graphGet(`/sites/${SP_SITE}`);
  spSiteId = d.id;
  return spSiteId;
}

/* ---------- window.storage shim — reads/writes SharePoint lists ---------- */
window.storage = {
  /* key → SharePoint list item title convention:
     'overrides' → PX_Partners list, item Title = 'overrides'
     'audit_v1'  → PX_Activity list, item Title = 'audit_v1'
     'absx_editor' stored in sessionStorage (personal, no sharing needed) */

  async get(key, shared) {
    /* personal user key — use sessionStorage */
    if (!shared) {
      const v = sessionStorage.getItem(key);
      return v ? { key, value: v, shared: false } : null;
    }
    /* shared → read from SharePoint */

      const d = await graphGet(
        `/sites/${siteId}/lists/${listName}/items?$filter=fields/Title eq '${key}'&$expand=fields&$top=1`
      );
      if (!d.value || !d.value.length) return null;
      const val = d.value[0].fields.DataValue || d.value[0].fields.Title2 || null;
      return val ? { key, value: val, shared: true } : null;
    } catch(e) {

      return null;
    }
  },

  async set(key, value, shared) {
    /* personal */
    if (!shared) {
      sessionStorage.setItem(key, value);
      return { key, value, shared: false };
    }
    /* shared → upsert SharePoint list item */
    try {
      const siteId = await getSiteId();
      const listName = key === 'audit_v1' ? SP_LIST_AUDIT : SP_LIST_OVERRIDES;
      /* check if item exists */
      const existing = await graphGet(
        `/sites/${siteId}/lists/${listName}/items?$filter=fields/Title eq '${key}'&$expand=fields&$top=1`
      );

      } else {
        await graphPost(`/sites/${siteId}/lists/${listName}/items`, { fields });
      }

    } catch(e) {
      console.warn('storage.set failed', key, e);
      return null;
    }
  },

  async delete(key, shared) {
    if (!shared) { sessionStorage.removeItem(key); return { key, deleted: true, shared: false }; }

  },

  async list(prefix, shared) {
    return { keys: [], prefix, shared };
  }

/* Promise Delivery Index — importance-weighted quality attainment, 0–100, across
   the stops that actually keep or break each promise. A quality 2 on a make-or-break
   stop drags far harder than a quality 2 on a marginal one, which is the point:
   the promise is only as strong as the moments that carry it. */
function promiseScore(p){
  let num = 0, den = 0, weak = null;
  const recs = p.stops.map(id => getRecord(id)).filter(r => r && r.id);
  recs.forEach(r => {
    num += r.quality * r.importance;
    den += 5 * r.importance;
    const gap = (5 - r.quality) * r.importance;
    if(!weak || gap > weak.gap) weak = {gap, r};
  });
  const reds = recs.filter(r => light(r.priority).key === 'red').length;
  return {score: den ? Math.round(num/den*100) : 0, weak, recs, reds};
}
function promiseBand(s){
  if(s >= 75) return {label:'Promise kept', hex:'#2F8F5B', cls:'lp-green'};
  if(s >= 55) return {label:'Patchy', hex:'#D6941B', cls:'lp-amber'};
  return {label:'Promise at risk', hex:'#C4453D', cls:'lp-red'};
}

/* ---------- lite audit trail (shared storage) ---------- */
const AUDIT_KEY = 'audit_v1';
const AUDIT_CAP = 800;      /* ring buffer: oldest entries fall off the end */
const VALUE_CLIP = 160;     /* keep the log light — long prose is trimmed */
let auditLog = [];
const FIELD_LABELS = {
  quality:'Quality', importance:'Importance', short:'Short title', touchpoint:'Touchpoint',
  motive:'Partner motive', owner:'Owner', system:'Platform', tmref:'TM Forum ref',
  route:'Route', programme:'Programme', problem:'Problem statement', insights:'Key insights',
  notes:'Field notes', actionPlan:'Action plan', '*reset*':'Reset to master',
  effort:'What it takes', stage:'Scope', lead:'Lead', win:'The win',
  targetQuality:'Target quality', dueBy:'Due by'
};
function fieldLabel(f){ return FIELD_LABELS[f] || f; }
function clipVal(v){
  const s = (v === undefined || v === null) ? '' : String(v);
  return s.length > VALUE_CLIP ? s.slice(0, VALUE_CLIP) + '…' : s;
}
async function loadAudit(){
  try{
    const r = await window.storage.get(AUDIT_KEY, true);
    auditLog = (r && r.value) ? (JSON.parse(r.value) || []) : [];
  }catch(e){ auditLog = []; }
  if(!Array.isArray(auditLog)) auditLog = [];
}
/* changes: [{f, from, to}] — re-reads the shared log first so two people editing
   at once don't overwrite each other's entries */
async function logChanges(id, changes){
  if(!changes || !changes.length) return;
  await loadAudit();
  const t = Date.now();
  changes.forEach(c => auditLog.push({
    t, u: USER || 'Unattributed', id, f: c.f, a: clipVal(c.from), b: clipVal(c.to)
  }));
  if(auditLog.length > AUDIT_CAP) auditLog = auditLog.slice(-AUDIT_CAP);
  try{ await window.storage.set(AUDIT_KEY, JSON.stringify(auditLog), true); }
  catch(e){ console.error('audit save failed', e); }
  renderWhoami();
}
function historyFor(id, field){
  return auditLog.filter(e => e.id === id && (!field || e.f === field)).slice().reverse();
}
function lastEdit(id){
  const h = historyFor(id);
  return h.length ? h[0] : null;
}
function ago(ts){
  const s = Math.max(0, Math.round((Date.now() - ts)/1000));
  if(s < 60) return 'just now';
  const m = Math.round(s/60); if(m < 60) return m + (m===1?' minute ago':' minutes ago');
  const h = Math.round(m/60); if(h < 24) return h + (h===1?' hour ago':' hours ago');
  const d = Math.round(h/24); if(d === 1) return 'yesterday';
  if(d < 8) return d + ' days ago';
  const dt = new Date(ts);
  return dt.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
}
function stamp(ts){
  return new Date(ts).toLocaleString('en-GB', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
}

/* ---------- overrides (shared storage) ---------- */
let overrides = {};

/* Shared storage can hand back a value written moments ago, so a reload must
   never clobber what this session has just saved. Every field we write is
   remembered briefly and re-applied on top of whatever comes back. */
const DELETED = '__ABSPX_DELETED__';
const WRITE_TTL = 45000;
let myWrites = {};
function rememberWrite(id, field, value){
  (myWrites[id] = myWrites[id] || {})[field] = {v: value, t: Date.now()};
}
function reapplyMyWrites(){
  const now = Date.now();
  Object.keys(myWrites).forEach(id => {
    const fields = myWrites[id];
    Object.keys(fields).forEach(f => {
      if(now - fields[f].t > WRITE_TTL){ delete fields[f]; return; }
      if(fields[f].v === DELETED){ if(overrides[id]) delete overrides[id][f]; }
      else { (overrides[id] = overrides[id] || {})[f] = fields[f].v; }
    });
    if(!Object.keys(fields).length) delete myWrites[id];
    if(overrides[id] && !Object.keys(overrides[id]).length) delete overrides[id];
  });
}
async function loadOverrides(){
  try{
    const res = await window.storage.get('overrides', true);
    overrides = (res && res.value) ? (JSON.parse(res.value) || {}) : {};
  }catch(e){ overrides = {}; }
  reapplyMyWrites();
}

/* every mutation runs strictly one at a time, so two quick clicks cannot interleave */
let mutationChain = Promise.resolve();
function queueMutation(fn){
  mutationChain = mutationChain.then(fn, fn);
  return mutationChain;
}
async function saveOverrides(){
  const payload = JSON.stringify(overrides);
  for(let attempt = 0; attempt < 2; attempt++){
    try{ await window.storage.set('overrides', payload, true); return true; }
    catch(e){ console.error('storage save failed', e); await new Promise(r => setTimeout(r, 250)); }
  }
  const t = document.getElementById('toast');
  if(t){
    t.innerHTML = `<span style="color:#FFD9D6"><b>That change did not save.</b> Check your connection and try again — the screen is ahead of the record.</span>
      <button class="tx" onclick="hideToast()" title="Dismiss">&times;</button>`;
    t.classList.add('open');
  }
  return false;
}
const EDITABLE = ['quality','importance','notes','actionPlan','short','touchpoint','motive','owner','system','tmref','route','programme','problem','insights',
                  'effort','stage','lead','win','targetQuality','dueBy','gearAt'];
/* written but never logged — an internal ordering stamp, not a decision */
const SILENT_FIELDS = new Set(['gearAt']);

/* ---------- scope: three in, three next, the rest watched ---------- */
const WIP_LIMIT = 3;      /* In Garage Now — three bays, never more */
const QUEUE_LIMIT = 3;    /* Next Up Queue */
const EFFORT = {
  quick:     {label:'Just do it',            hint:'One team, no system change — days',           div:0.6, cls:'ef-quick'},
  system:    {label:'Needs a system change', hint:'Platform work with an IT dependency — weeks', div:1.0, cls:'ef-system'},
  programme: {label:'Needs the programme',   hint:'Multi-team build — quarters',                 div:1.6, cls:'ef-programme'},
};
/* three gears, and only three. Every touchpoint is in exactly one. */
const STAGES = {
  active: {label:'In Garage Now', short:'In garage', cls:'active', colour:'var(--royal)',
           blurb:'On the ramp now — being worked on this period.'},
  queued: {label:'Next Up Queue', short:'Next up',  cls:'queued', colour:'var(--gear-queue)',
           blurb:'Ready to roll in the moment a bay frees up.'},
  watch:  {label:'Back Burner',   short:'Back burner', cls:'watch', colour:'var(--gear-back)',
           blurb:'Recorded and scored, but not yet queued for focus.'},
};
const GEARS = ['active','queued','watch'];
/* legacy 'done' from an earlier build folds back onto the burner */
function stageOf(rec){ const s = rec.stage === 'done' ? 'watch' : rec.stage; return STAGES[s] ? s : 'watch'; }
function gearPill(stage, size){
  const g = STAGES[stage];
  return `<span class="gearpill gear-${stage}" title="${escapeAttr(g.blurb)}"><i></i>${escapeHtml(g.label)}</span>`;
}
/* the switch that appears on every touchpoint */
function gearSwitch(id, stage){
  return `<div class="gearswitch" title="Move this touchpoint between gears">
    ${GEARS.map(g => `<button class="g-${g} ${g===stage?'on':''}" onclick="setStage('${escapeAttr(id)}','${g}')" title="${escapeAttr(STAGES[g].blurb)}"><i></i>${escapeHtml(STAGES[g].label)}</button>`).join('')}
  </div>`;
}
function gearLegend(){
  return `<div class="gearlegend">
    ${GEARS.map(g => `<span><i style="background:${STAGES[g].colour}"></i><b style="color:var(--navy-800)">${escapeHtml(STAGES[g].label)}</b> — ${escapeHtml(STAGES[g].blurb)}</span>`).join('')}
  </div>`;
}
/* the Lead-to-Order blueprint spans Find, Commit and Get Connected, so it is
   reachable from every stop and every chapter page in those three chapters */
const L2O_CHAPTERS = CHAPTERS.slice(0,3);
function inL2O(chapter){ return L2O_CHAPTERS.includes(chapter); }
function l2oButton(){
  return `<button class="l2obtn" title="This chapter is covered by the Lead-to-Order blueprint — the 22-step as-is and the ten-step redesign" onclick="go('#/l2o')">${svgIcon('trend',13)} L2O blueprint</button>`;
}
function inStage(s){ return DATA.map(d => getRecord(d.id)).filter(r => stageOf(r) === s); }

/* Each gear is an ordered list, so "the first one selected" and "third in line"
   mean something exact. gearAt stamps when a touchpoint entered its gear. */
let seqCounter = 0;
function nextSeq(){ seqCounter = Math.max(Date.now(), seqCounter + 1); return seqCounter; }
function gearSeq(rec){ const n = parseInt(rec.gearAt, 10); return isNaN(n) ? 0 : n; }
/* garage: longest on the ramp first — bay 1 is the next to be bumped */
function garageOrder(){ return inStage('active').sort((a,b) => gearSeq(a) - gearSeq(b) || a.id.localeCompare(b.id)); }
/* queue: most recently promoted first — 3rd in line is the next to fall off */
function queueOrder(){ return inStage('queued').sort((a,b) => gearSeq(b) - gearSeq(a) || a.id.localeCompare(b.id)); }
function ordinal(n){ return n + (['th','st','nd','rd'][(n%100>10&&n%100<14)?0:Math.min(n%10,4)] || 'th'); }
function effortChip(rec, size){
  const e = EFFORT[rec.effort];
  return e ? `<span class="efchip ${e.cls}" title="${escapeAttr(e.hint)}">${escapeHtml(e.label)}</span>`
           : `<span class="efchip ef-unset" title="Set what it takes and this stop can be ranked properly">Effort not set</span>`;
}

/* Fix Score — not how much it hurts (that's the Priority Index) but how good a
   next move it is. Pain, adjusted for who it reaches, what it unblocks,
   whether anyone is already coming for it, and what it takes to do. */
function fixScore(id){
  const rec = getRecord(id);
  const base = DATA.find(d => d.id === id) || {};
  const pain = rec.priority;
  const side = rec.route === 'Sidestreet';
  const reach = side ? 0.7 : 1;
  const links = (base.related || []).length;
  const lev = 1 + links * 0.05;
  const orphan = (!rec.programme || rec.programme === '—');
  const orph = orphan ? 1.15 : 1;
  const ef = EFFORT[rec.effort];
  const div = ef ? ef.div : 1;
  return {
    score: Math.round(pain * reach * lev * orph / div),
    pain, side, links, lev, orphan, effort: rec.effort || '', div, effortSet: !!ef
  };
}
function fsChips(f){
  const c = [];
  c.push(`<span class="fschip">Pain ${f.pain}</span>`);
  c.push(f.side ? `<span class="fschip down">Sidestreet ×0.7</span>` : `<span class="fschip up">Mainstreet ×1.0</span>`);
  c.push(`<span class="fschip ${f.links>=5?'up':''}">Unblocks ${f.links} ×${f.lev.toFixed(2)}</span>`);
  if(f.orphan) c.push(`<span class="fschip up" title="No programme is coming for this — it stays broken unless someone picks it up">Nobody’s coming ×1.15</span>`);
  c.push(f.effortSet
    ? `<span class="fschip ${f.div<1?'up':(f.div>1?'down':'')}">${escapeHtml(EFFORT[f.effort].label)} ÷${f.div}</span>`
    : `<span class="fschip down">Effort not set ÷1</span>`);
  return `<div class="fsbreak">${c.join('')}</div>`;
}

/* the shortlist: everything not yet in scope, best next move first, with
   honest joint ranks where the maths genuinely cannot separate two stops */
function shortlist(){
  const rows = DATA
    .map(d => ({id: d.id, rec: getRecord(d.id), f: fixScore(d.id)}))
    .filter(x => stageOf(x.rec) === 'watch')
    .sort((a,b) => b.f.score - a.f.score || b.rec.importance - a.rec.importance || a.id.localeCompare(b.id));
  const counts = {};
  rows.forEach(r => { counts[r.f.score] = (counts[r.f.score] || 0) + 1; });
  let rank = 0, prev = null;
  rows.forEach((r, i) => {
    if(r.f.score !== prev){ rank = i + 1; prev = r.f.score; }
    r.rank = rank; r.joint = counts[r.f.score] > 1;
  });
  return rows;
}

/* ---------- moving things in and out of scope ---------- */
/* ---------- moving between gears, with the knock-on shown first ---------- */
/* Work out every move a single choice forces. Nothing is written until OK. */
function planMove(id, stage){
  const moves = [{id, to: stage, role: 'in'}];
  if(stage === 'active'){
    const garage = garageOrder().filter(r => r.id !== id);
    const queue  = queueOrder().filter(r => r.id !== id);
    const bumped = garage.slice(0, Math.max(0, garage.length - (WIP_LIMIT - 1)));
    const over   = Math.max(0, (queue.length + bumped.length) - QUEUE_LIMIT);
    const dropped = over ? queue.slice(queue.length - over) : [];
    bumped.forEach((r,i) => moves.push({id: r.id, to: 'queued', role: 'bumped',
      note: `longest on the ramp — moves to ${ordinal(i+1)} in line`}));
    dropped.forEach(r => moves.push({id: r.id, to: 'watch', role: 'dropped',
      note: `was ${ordinal(queue.indexOf(r) + 1)} in line — falls off the queue`}));
  } else if(stage === 'queued'){
    const queue = queueOrder().filter(r => r.id !== id);
    const over = Math.max(0, (queue.length + 1) - QUEUE_LIMIT);
    (over ? queue.slice(queue.length - over) : []).forEach(r => moves.push({id: r.id, to: 'watch',
      role: 'dropped', note: `was ${ordinal(queue.indexOf(r) + 1)} in line — falls off the queue`}));
  }
  return moves;
}
/* A gear change re-flows the lane, which slides the next card's buttons under
   the cursor. Without this guard an impatient second click moves a second
   touchpoint you never meant to touch. */
let lastGearChangeAt = 0;
const GEAR_CLICK_GUARD = 450;
async function setStage(id, stage){
  if(!requireUser()) return;
  if(stageOf(getRecord(id)) === stage) return;
  const now = Date.now();
  if(now - lastGearChangeAt < GEAR_CLICK_GUARD) return;   /* swallow the stray repeat */
  lastGearChangeAt = now;
  const moves = planMove(id, stage);
  if(moves.length > 1){ openCascade(id, stage, moves); return; }
  await applyMoves(moves);
}
async function applyMoves(moves){
  /* remember exactly where everything was, so one Undo puts it all back */
  undoStack = moves.map(m => {
    const r = getRecord(m.id);
    return {id: m.id, stage: stageOf(r), gearAt: r.gearAt === undefined ? '' : r.gearAt};
  });
  await commitMany(moves.map(m => ({id: m.id, vals: {stage: m.to, gearAt: nextSeq()}})));
  showUndo(moves);
}
let undoStack = null;
function showUndo(moves){
  if(!undoStack || !undoStack.length) return;
  const first = getRecord(moves[0].id);
  const msg = moves.length === 1
    ? `<b>${escapeHtml(first.short)}</b> moved to ${escapeHtml(STAGES[moves[0].to].label)}`
    : `${moves.length} touchpoints moved — <b>${escapeHtml(first.short)}</b> into ${escapeHtml(STAGES[moves[0].to].label)}`;
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${msg}</span><button onclick="undoGearMove()">Undo</button>
    <button class="tx" onclick="hideToast()" title="Dismiss">&times;</button>`;
  t.classList.add('open');
  clearTimeout(showUndo._t);
  showUndo._t = setTimeout(hideToast, 9000);
}
function hideToast(){ const t = document.getElementById('toast'); if(t) t.classList.remove('open'); }
async function undoGearMove(){
  const back = undoStack; undoStack = null;
  hideToast();
  lastGearChangeAt = 0;
  if(!back || !back.length) return;
  await commitMany(back.map(m => ({id: m.id, vals: {stage: m.stage, gearAt: m.gearAt}})));
}
/* the pop-up: what comes in, what steps back, what falls off. OK or Cancel. */
let pendingMoves = null;
function openCascade(id, stage, moves){
  pendingMoves = moves;
  const rec = getRecord(id);
  const bumped = moves.filter(m => m.role === 'bumped');
  const dropped = moves.filter(m => m.role === 'dropped');
  const row = (m, lead) => {
    const r = getRecord(m.id);
    return `<div class="cascrow ${m.role}">
      <div class="cascarrow">${lead}</div>
      <div style="flex:1; min-width:0">
        <div class="cascname">${escapeHtml(m.id)} · ${escapeHtml(r.short)}</div>
        ${m.note ? `<div class="cascnote">${escapeHtml(m.note)}</div>` : ''}
      </div>
      ${gearPill(m.to)}
    </div>`;
  };
  openModal(`
    <div class="mhead">
      <button class="mx" onclick="cancelCascade()">&times;</button>
      <div class="eyebrow">Bay limit · ${WIP_LIMIT} in the garage, ${QUEUE_LIMIT} in the queue</div>
      <h2>${stage === 'active' ? 'The garage is full — here is the knock-on' : 'The queue is full — here is the knock-on'}</h2>
      <p>Bringing <b>${escapeHtml(rec.short)}</b> in pushes everything down a place. These are the moves:</p>
    </div>
    <div class="mbody">
      ${row(moves[0], 'IN')}
      ${bumped.map(m => row(m, 'BACK')).join('')}
      ${dropped.map(m => row(m, 'OUT')).join('')}
      <div class="cascsum">${dropped.length
        ? `<b>${escapeHtml(getRecord(bumped[0].id).short)}</b> leaves the garage for the queue, and <b>${escapeHtml(getRecord(dropped[0].id).short)}</b> is deprioritised to the Back Burner. All three moves are logged against your name.`
        : `<b>${escapeHtml(getRecord((bumped[0]||moves[0]).id).short)}</b> steps back into the queue. Both moves are logged against your name.`}</div>
    </div>
    <div class="mfoot">
      <button class="btn" onclick="confirmCascade()">OK</button>
      <button class="btn ghost" onclick="cancelCascade()">Cancel</button>
    </div>`);
}
async function confirmCascade(){
  const moves = pendingMoves; pendingMoves = null;
  closeModal();
  if(moves) await applyMoves(moves);
}
function cancelCascade(){ pendingMoves = null; closeModal(); }

/* ---------- drag and drop between gears ---------- */
let dragId = null;
/* A card is only draggable once you press its grip. Before this, pressing any
   button and twitching the mouse could start a drag and move the wrong card. */
function armDrag(ev){
  const card = ev.currentTarget.closest('[data-drag]');
  if(card) card.setAttribute('draggable','true');
}
function disarmDrag(){
  document.querySelectorAll('[data-drag][draggable="true"]').forEach(c => c.setAttribute('draggable','false'));
}
document.addEventListener('mouseup', disarmDrag);
document.addEventListener('dragend', disarmDrag);
function dragStart(ev, id){
  dragId = id;
  try{ ev.dataTransfer.setData('text/plain', id); ev.dataTransfer.effectAllowed = 'move'; }catch(e){}
  const el = ev.currentTarget;
  el.classList.add('dragging');
  document.body.classList.add('dragging-now');
  el.addEventListener('dragend', () => { el.classList.remove('dragging'); dragId = null;
    document.body.classList.remove('dragging-now');
    document.querySelectorAll('.over').forEach(z => z.classList.remove('over')); }, {once:true});
}
function dragOver(ev){
  if(!dragId) return;
  ev.preventDefault();
  try{ ev.dataTransfer.dropEffect = 'move'; }catch(e){}
  ev.currentTarget.classList.add('over');
}
function dragLeave(ev){
  const z = ev.currentTarget;
  if(!z.contains(ev.relatedTarget)) z.classList.remove('over');
}
async function dropOn(ev, stage){
  ev.preventDefault();
  document.body.classList.remove('dragging-now');
  ev.currentTarget.classList.remove('over');
  let id = dragId;
  try{ id = ev.dataTransfer.getData('text/plain') || dragId; }catch(e){}
  dragId = null;
  if(!id) return;
  if(stageOf(getRecord(id)) === stage) return;
  await setStage(id, stage);
}
function dz(stage){
  return `class="dropzone" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropOn(event,'${stage}')"`;
}
/* sticky dock: three drop targets that stay put however far you scroll */
function gearDock(){
  return `<div class="geardock" id="geardock">
    <div class="dklbl">Drag any card onto a gear</div>
    ${GEARS.map(g => {
      const n = inStage(g).length;
      const limit = g === 'active' ? WIP_LIMIT : (g === 'queued' ? QUEUE_LIMIT : null);
      return `<div class="dockzone g-${g}" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropOn(event,'${g}')" title="${escapeAttr(STAGES[g].blurb)}">
        <span class="dkn">${n}${limit ? `<span style="font-size:12px; color:var(--grey-400);">/${limit}</span>` : ''}</span>
        <span><span class="dkt">${escapeHtml(STAGES[g].label)}</span><br><span class="dks">${g==='active'?'on the ramp':(g==='queued'?'ready to roll':'scored, not queued')}</span></span>
      </div>`;
    }).join('')}
  </div>`;
}
/* auto-scroll the main pane when a drag nears its edges */
document.addEventListener('dragover', e => {
  if(!dragId) return;
  const main = document.getElementById('main');
  if(!main) return;
  const r = main.getBoundingClientRect();
  const edge = 90;
  if(e.clientY < r.top + edge) main.scrollTop -= 22;
  else if(e.clientY > r.bottom - edge) main.scrollTop += 22;
});
function daysTo(dstr){
  if(!dstr) return null;
  const d = new Date(dstr + 'T00:00:00');
  if(isNaN(d)) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}
function duePill(dstr){
  const n = daysTo(dstr);
  if(n === null) return `<span class="duepill none">No date set</span>`;
  const when = new Date(dstr + 'T00:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short'});
  if(n < 0) return `<span class="duepill late">${escapeHtml(when)} · ${-n} day${n===-1?'':'s'} over</span>`;
  if(n <= 14) return `<span class="duepill soon">${escapeHtml(when)} · ${n} day${n===1?'':'s'} left</span>`;
  return `<span class="duepill">${escapeHtml(when)} · ${n} days left</span>`;
}
/* movement against the June 2026 baseline — derived from the scores themselves,
   so nobody has to remember to tick a box for it to count */
function improved(){
  let pts = 0; const stops = [];
  DATA.forEach(b => {
    const r = getRecord(b.id);
    const basePriority = (6 - b.quality) * b.importance * 4;
    if(r.priority < basePriority){ pts += basePriority - r.priority; stops.push(r); }
  });
  return {count: stops.length, pts, stops};
}
function getRecord(id){
  const base = DATA.find(d => d.id === id);
  if(!base) return {};
  const ov = overrides[id] || {};
  const rec = {...base};
  EDITABLE.forEach(k => { if(ov[k] !== undefined) rec[k] = ov[k]; });
  rec.priority = (6 - rec.quality) * rec.importance * 4;
  return rec;
}

/* ---------- traffic light ---------- */
function light(p){
  if(p >= 70) return {key:'red', color:'var(--red)', hex:'#C4453D', label:'Fix now', cls:'lp-red'};
  if(p >= 45) return {key:'amber', color:'var(--amber)', hex:'#D6941B', label:'Watch', cls:'lp-amber'};
  return {key:'green', color:'var(--green)', hex:'#2F8F5B', label:'Healthy', cls:'lp-green'};
}

function lane(stage, title, limit, hint){
  const items = stage === 'active' ? garageOrder() : queueOrder();
  const n = items.length;
  const capCls = n > limit ? 'over' : (n === limit ? 'full' : '');
  const slots = items.map((r,i) => slotCard(r, stage, i+1)).join('');
  const empties = Array.from({length: Math.max(0, limit - n)}, () => `<div class="slot empty">

    </div>`).join('');
  const mix = stage === 'active' && n ? (() => {
    const q = items.filter(r => r.effort === 'quick').length;
    const p = items.filter(r => r.effort === 'programme').length;

    if(items.filter(r=>r.effort==='system').length) bits.push(`${items.filter(r=>r.effort==='system').length} system change${items.filter(r=>r.effort==='system').length===1?'':'s'}`);
    if(p) bits.push(`${p} programme build${p===1?'':'s'}`);
    const unset = items.filter(r => !EFFORT[r.effort]).length;

    return bits.join(' · ');
  })() : '';
  return `<div class="lane g-${stage}">
    <div class="lanehead">
      <h3>${escapeHtml(title)}</h3>
